name: Cerebro · decisiones

# La web de Cerebros abre un issue "[cerebro] N decisiones" con un bloque JSON.
# Este workflow lo aplica a la memoria (el cerebro aprende de ellas), publica y
# cierra el issue con un informe. Solo acepta issues del dueño o colaboradores.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  aplicar:
    if: >-
      startsWith(github.event.issue.title, '[cerebro]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar decisiones
        # El cuerpo del issue solo se lee como datos JSON desde el archivo del evento.
        run: python -m cerebro issue "$GITHUB_EVENT_PATH" --salida informe.md

      - name: Publicar
        run: |
          scripts/publish.sh "cerebro: decisiones del issue #${{ github.event.issue.number }} [skip ci]" \
            cerebro/cerebros/*/memoria.json docs/cerebro/data/*.json

      - name: Informar y cerrar el issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          [ -f informe.md ] || echo "No se pudieron aplicar las decisiones; revisa el log del workflow." > informe.md
          printf '\n\n---\n_Aplicado por el workflow Cerebro · decisiones._\n' >> informe.md
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file informe.md
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
