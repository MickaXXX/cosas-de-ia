name: Actualizar datos de mercado

on:
  schedule:
    # Lunes a viernes, 21:30 UTC (≈ 17:30/18:30 Chile), tras el cierre de Wall Street.
    - cron: "30 21 * * 1-5"
    # Domingo por la noche: refresca noticias/consenso antes de la semana.
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Solo estos tickers (coma). Vacío = todo el universo"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar datos
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python scripts/update_data.py --only "${{ github.event.inputs.only }}"
          else
            python scripts/update_data.py
          fi

      - name: Publicar (commit a la rama)
        run: |
          git config user.name "market-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
