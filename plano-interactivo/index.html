<title>Plano Fotográfico de Planta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: plan-first workspace. Drafting-film plan canvas, ficha rail on the right, photo tray docked under the plan. */
:root{
  --paper:#e9ede9; --surface:#fbfcfa; --surface-2:#f2f5f1; --ink:#17201c; --muted:#5a6761; --line:#d2d9d4; --line-2:#e4e9e5;
  --plan-bg:#f5f7f3; --plan-dot:#d8ded8; --plan-filter:none;
  --signal:#f5b700; --signal-ink:#2e2300; --focus:#1c7ed6; --danger:#c92a2a; --ok:#2b8a3e;
  --scrim:rgba(14,20,17,.55); --lb-bg:#0e1311;
  --shadow:0 1px 2px rgba(23,32,28,.08),0 10px 28px rgba(23,32,28,.10);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --side-w:400px; --tray-h:270px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1412; --surface:#171e1b; --surface-2:#1d2622; --ink:#e6ebe7; --muted:#97a59e; --line:#2c3732; --line-2:#232d29;
  --plan-bg:#111815; --plan-dot:#1f2a25; --plan-filter:invert(1) hue-rotate(180deg) brightness(.92);
  --signal:#ffc61a; --signal-ink:#2e2300; --focus:#4dabf7; --danger:#ff6b6b; --ok:#51cf66;
  --scrim:rgba(0,0,0,.6); --lb-bg:#070a09;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1412; --surface:#171e1b; --surface-2:#1d2622; --ink:#e6ebe7; --muted:#97a59e; --line:#2c3732; --line-2:#232d29;
  --plan-bg:#111815; --plan-dot:#1f2a25; --plan-filter:invert(1) hue-rotate(180deg) brightness(.92);
  --signal:#ffc61a; --signal-ink:#2e2300; --focus:#4dabf7; --danger:#ff6b6b; --ok:#51cf66;
  --scrim:rgba(0,0,0,.6); --lb-bg:#070a09;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--side-w);grid-template-rows:auto minmax(0,1fr) var(--tray-h);
  grid-template-areas:"top top" "stage side" "tray side"}
.app[data-tray="min"]{--tray-h:46px}
.app[data-tray="max"]{--tray-h:56%}

/* ---------- header ---------- */
.top{grid-area:top;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.seg .s{display:none}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--ink);color:var(--surface);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand h1{margin:0;font:700 21px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .search{flex:1 1 260px;max-width:440px}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search:focus-within{border-color:var(--focus)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%}
.search kbd{font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);flex:none}
.seg button{padding:0 14px;height:36px;font:600 14px var(--f-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap;margin-left:auto}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn[data-s="cloud"] i{background:var(--ok)}
.conn[data-s="local"] i{background:var(--signal)}

/* ---------- stage / plan ---------- */
.stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;background:var(--plan-bg);
  background-image:radial-gradient(var(--plan-dot) 1px,transparent 1.2px);background-size:22px 22px;border-right:1px solid var(--line)}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.viewport.panning{cursor:grabbing}
.app[data-mode="edit"] .viewport{cursor:crosshair}
.world{position:absolute;left:0;top:0;width:3427px;height:2853px;transform-origin:0 0;will-change:transform}
.world img{position:absolute;left:0;top:0;max-width:none;width:100%;height:100%;pointer-events:none;filter:var(--plan-filter);-webkit-user-drag:none}
.viewport[data-lod="lo"] .plan-hi{visibility:hidden}
.viewport[data-lod="hi"] .plan-lo{visibility:hidden}

.mk{position:absolute;width:0;height:0;transform:scale(var(--inv,1));transform-origin:0 0;z-index:2}
.mk-dot{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;border:2px solid var(--surface);
  font:700 13px/24px var(--f-display);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.mk.empty .mk-dot{background:var(--surface);color:var(--c);border:2px solid var(--c)}
.mk-count{position:absolute;left:5px;top:-24px;min-width:19px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--surface);
  font:500 11px/18px var(--f-mono);text-align:center;box-shadow:0 0 0 1.5px var(--surface)}
.mk-label{position:absolute;left:19px;top:-11px;white-space:nowrap;background:var(--ink);color:var(--surface);font:600 12.5px/22px var(--f-display);
  letter-spacing:.05em;text-transform:uppercase;padding:0 8px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .15s}
.viewport.labels .mk-label,.mk:hover .mk-label,.mk:focus-visible .mk-label,.mk.sel .mk-label,.mk.drop-hot .mk-label{opacity:1}
.mk:hover,.mk.sel,.mk.drop-hot{z-index:5}
.mk:hover .mk-dot{transform:scale(1.12)}
.mk.sel .mk-dot{box-shadow:0 0 0 4px var(--signal),0 2px 8px rgba(0,0,0,.4)}
.mk.sel::before{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid var(--signal);animation:ping 1.6s ease-out infinite;pointer-events:none}
.mk.drop-hot .mk-dot{transform:scale(1.35);box-shadow:0 0 0 5px var(--signal)}
.mk.dim{opacity:.22}
.cl-dot{position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;background:var(--g);box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.cl-dot::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.cl-dot b{position:relative;font:700 15px/1 var(--f-display);color:var(--ink)}
.cl .mk-count{left:9px;top:-30px}
.cl .mk-label{left:24px;text-transform:none;letter-spacing:.01em;font-weight:500}
.cl:hover .cl-dot,.cl.spring .cl-dot{transform:scale(1.12)}
.cl.spring .cl-dot{box-shadow:0 0 0 5px var(--signal)}
.mk:focus-visible{outline:none}
.mk:focus-visible .mk-dot{outline:2px solid var(--focus);outline-offset:3px}
.app[data-mode="edit"] .mk-dot{cursor:move}
.app.assigning .mk:not(.dim) .mk-dot{animation:bob 1.2s ease-in-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes bob{50%{transform:scale(1.18)}}

.vp-ui{position:absolute;z-index:10}
.filters{left:12px;top:12px;right:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:none;padding-bottom:4px}
.filters::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:15px;background:var(--surface);
  border:1px solid var(--line);font:600 13px var(--f-body);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted))}
.chip small{font:500 11px var(--f-mono);color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.chip.toggle[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.toggle[aria-pressed="true"] small{color:inherit}
.zoom{right:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line-2)}
.zoom button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.legend-scale{left:12px;bottom:12px;font:500 11px var(--f-mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:calc(100% - 90px)}
.banner{left:12px;right:12px;margin-inline:auto;width:max-content;top:54px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);
  padding:9px 10px 9px 14px;border-radius:10px;background:var(--signal);color:var(--signal-ink);box-shadow:var(--shadow);font-weight:600}
.banner .btn{height:32px}
.banner .btn.ghost{background:rgba(255,255,255,.55);color:var(--signal-ink);border-color:transparent}
.edit-hint{left:12px;bottom:12px;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px;max-width:min(420px,calc(100% - 90px))}
.edit-hint b{color:var(--signal)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:600 14px var(--f-body);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- side panel ---------- */
.side{grid-area:side;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
.side-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.pad{padding:16px 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stats div+div{border-left:1px solid var(--line-2)}
.stats b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.stats .warn b{color:var(--ink)}
.stats .warn{background:color-mix(in srgb,var(--signal) 16%,transparent)}
.list-tools{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.list-tools p{margin:0;font-size:13px;color:var(--muted);flex:1}
.sec-h{display:flex;align-items:center;gap:8px;margin:0;padding:14px 18px 6px;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sec-h span{margin-left:auto;font:500 11px var(--f-mono)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 18px;border-top:1px solid var(--line-2)}
.prow:hover{background:var(--surface-2)}
.prow.sel{background:color-mix(in srgb,var(--signal) 18%,transparent)}
.prow.drop-hot{background:var(--signal);color:var(--signal-ink)}
.code{display:inline-grid;place-items:center;min-width:44px;height:24px;padding:0 6px;border-radius:5px;background:var(--c);color:#fff;font:500 11.5px var(--f-mono)}
.code.empty{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.pname{min-width:0}
.pname b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcount{font:500 12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.pcount.has{color:var(--ink)}
.empty-state{margin:18px;padding:22px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.empty-state h3{margin:0 0 6px;color:var(--ink);font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.empty-state p{margin:0 0 14px;font-size:14px}

/* ficha */
.f-top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.f-top .back{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
.f-top .back:hover{background:var(--surface-2);color:var(--ink)}
.f-head{position:relative;padding:16px 18px 14px 22px;border-bottom:1px solid var(--line)}
.f-head::before{content:"";position:absolute;left:0;top:16px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sec-chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);font:600 12px var(--f-body);text-transform:none;letter-spacing:0}
.sec-chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.f-head h2{margin:6px 0 10px;font:700 28px/1.05 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.meta{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0;font-size:14px}
.meta dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.f-desc{margin:10px 0 0;font-size:14px;color:var(--ink);white-space:pre-wrap}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form .row2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.inp{width:100%;min-width:0;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--ink);font-size:14.5px}
textarea.inp{height:auto;min-height:70px;padding:8px 10px;resize:vertical;line-height:1.4}
.inp:focus{outline:none;border-color:var(--focus)}
.f-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.tabs button{position:relative;height:42px;padding:0 10px;font:600 14px var(--f-body);color:var(--muted)}
.tabs button small{font:500 11px var(--f-mono);margin-left:3px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:2px;background:var(--ink)}
.dropzone{display:flex;align-items:center;gap:12px;margin:14px 18px 6px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13.5px}
.dropzone.drop-hot{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 22%,transparent);color:var(--ink)}
.dropzone .btn{margin-left:auto}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.f-body .grid{padding:8px 18px 18px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;background:var(--surface-2);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.tile::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
.tile.sel::after{box-shadow:inset 0 0 0 3px var(--signal)}
.tile.sel img{transform:scale(.9);border-radius:4px}
.tile img{transition:transform .12s}
.tile-check{position:absolute;left:5px;top:5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 2px #fff;color:transparent}
.tile-check svg{width:14px;height:14px;stroke-width:3}
.tile.sel .tile-check{background:var(--signal);color:var(--signal-ink);box-shadow:none}
.tile-open{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .12s}
.tile:hover .tile-open,.tile:focus-within .tile-open{opacity:1}
@media (hover:none){.tile-open{opacity:1}}
.tile-open svg{width:15px;height:15px}
.tile-tag{position:absolute;left:5px;bottom:5px;right:5px;display:flex;gap:4px;justify-content:space-between;pointer-events:none}
.tile-tag span{font:500 10.5px/18px var(--f-mono);padding:0 5px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff}
.tile-tag .ex{background:var(--signal);color:var(--signal-ink)}
.tile.ghosted{opacity:.35}

.selbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--ink);color:var(--surface);border-radius:10px;margin:8px 0}
.selbar b{font-weight:600;margin-right:auto}
.selbar .btn{height:32px;font-size:13px}
.selbar .btn:not(.signal):not(.armed){background:transparent;color:var(--surface);border-color:rgba(255,255,255,.3)}
.selbar .icon-btn{color:var(--surface)}
.f-body .selbar{margin:8px 18px 0}

/* historial */
.hist{padding:8px 18px 22px}
.hist-tools{display:flex;gap:8px;align-items:center;padding:12px 18px 0}
.hist-tools p{margin:0;font-size:13px;color:var(--muted);flex:1}
.hist h4{margin:16px 0 8px;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hday{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.hday::before{content:"";position:absolute;left:21px;top:34px;bottom:0;width:2px;background:var(--line)}
.hday:last-child::before{display:none}
.hdate{width:44px;height:44px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hdate b{font:700 18px var(--f-display)}
.hdate span{font:500 10px var(--f-mono);text-transform:uppercase;color:var(--muted);margin-top:2px}
.hbody small{display:block;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.hstrip{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.hstrip .tile{width:72px;flex:none}

/* notas */
.notes{padding:14px 18px 22px;display:grid;gap:12px}
.note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.note header{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.note header b{color:var(--ink);font-weight:600}
.note header .icon-btn{margin-left:auto;width:28px;height:28px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- tray ---------- */
.tray{grid-area:tray;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line)}
.tray.drop-hot{box-shadow:inset 0 0 0 3px var(--signal)}
.tray-head{display:flex;align-items:center;gap:10px;min-height:46px;padding:5px 12px 5px 6px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.tray-title{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:8px;font:700 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.tray-title:hover{background:var(--surface-2)}
.tray-title .badge{min-width:24px;height:20px;padding:0 6px;border-radius:10px;background:var(--signal);color:var(--signal-ink);font:500 12px/20px var(--f-mono);letter-spacing:0;text-align:center}
.tray-title .badge.zero{background:var(--surface-2);color:var(--muted)}
.tray-title svg{transition:transform .15s}
.app[data-tray="min"] .tray-title svg{transform:rotate(180deg)}
.tray-hint{font-size:13px;color:var(--muted);flex:1 1 200px;min-width:0}
.tray-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
.tray-body{flex:1;min-height:0;overflow:auto;padding:4px 12px 14px;overscroll-behavior:contain}
.app[data-tray="min"] .tray-body{display:none}
.grp{margin-top:10px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px}
.grp-h b{font-weight:600}
.grp-h span{color:var(--muted)}
.grp-h .btn{margin-left:auto}
.tray-list{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 30px}
.tray .grp{flex:0 1 auto;max-width:100%;min-width:0}
.tray .grp .grid{display:flex;flex-wrap:wrap;gap:6px}
.tray .grp .tile{width:100px;flex:none}
.progress{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--surface-2);font-size:13px}
.progress .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.tray-empty{display:flex;align-items:center;gap:16px;margin-top:12px;padding:16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.tray-empty b{color:var(--ink)}
.tray-empty svg{width:34px;height:34px;flex:none;stroke-width:1.4}

/* ---------- overlays ---------- */
.mtabs{display:none}
.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(var(--tray-h) + 18px);z-index:60;display:flex;align-items:center;gap:12px;
  max-width:calc(100% - 32px);padding:10px 10px 10px 16px;border-radius:10px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);font-size:14px}
.toast .btn{height:30px;background:transparent;color:var(--signal);border-color:rgba(255,255,255,.25)}
.dragghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;width:76px;height:76px}
.dragghost img{position:absolute;inset:0;width:76px;height:76px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.dragghost img:nth-child(2){transform:rotate(-6deg) translate(-4px,2px)}
.dragghost img:nth-child(3){transform:rotate(6deg) translate(4px,2px)}
.dragghost b{position:absolute;right:-8px;top:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--signal);color:var(--signal-ink);font:600 13px/26px var(--f-mono);text-align:center;z-index:2}
.dragghost em{position:absolute;left:84px;top:22px;white-space:nowrap;font:600 13px/28px var(--f-body);font-style:normal;background:var(--ink);color:var(--surface);padding:0 10px;border-radius:6px}
.filedrop{position:fixed;inset:10px;z-index:70;border:3px dashed var(--signal);border-radius:16px;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:24px}
.filedrop span{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600}

.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(520px,100%);max-height:min(640px,100%);display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font:700 20px var(--f-display);text-transform:uppercase;letter-spacing:.03em;flex:1}
.sheet .search{flex:none;margin:12px 16px 6px}
.sheet-body{overflow:auto;min-height:0;padding-bottom:8px}

.lb{position:fixed;inset:0;z-index:55;display:grid;grid-template-columns:minmax(0,1fr) 340px;background:var(--lb-bg);color:#e9eeea}
.lb-stage{position:relative;min-width:0;min-height:0;display:grid;place-items:center;touch-action:pan-y}
.lb-stage img{max-width:calc(100% - 24px);max-height:calc(100% - 24px);object-fit:contain;border-radius:4px;user-select:none;-webkit-user-drag:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.lb-nav:hover{background:rgba(255,255,255,.22)}
.lb-nav.prev{left:12px}.lb-nav.next{right:12px}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.lb-count{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:64px;font:500 12px var(--f-mono);color:rgba(255,255,255,.7)}
.lb-info{background:var(--surface);color:var(--ink);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.lb-info h3{margin:0;font:700 22px/1.1 var(--f-display)}
.lb-info .meta{font-size:13.5px}
.lb-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.lb-links a{color:var(--ink)}

.cmp-stage{position:relative;flex:1;min-height:0;background:var(--lb-bg);display:grid;place-items:center;overflow:hidden}
.cmp-box{position:relative;max-width:100%;max-height:100%}
.cmp-box img{display:block;max-width:100%;max-height:min(62vh,560px);object-fit:contain;user-select:none;-webkit-user-drag:none}
.cmp-box img.after{position:absolute;inset:0;width:100%;height:100%;clip-path:inset(0 0 0 var(--pos,50%))}
.cmp-line{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:var(--signal);pointer-events:none}
.cmp-tag{position:absolute;top:8px;font:500 11px/20px var(--f-mono);padding:0 7px;border-radius:4px;background:rgba(0,0,0,.65);color:#fff}
.cmp-ctrl{display:grid;gap:10px;padding:14px 16px}
.cmp-ctrl .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-ctrl label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.cmp-ctrl input[type=range]{width:100%;accent-color:var(--signal)}
.sheet.wide{width:min(900px,100%);max-height:calc(100% - 8px)}

.readonly-note{margin:12px 18px 0;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:1100px){:root{--side-w:340px}}
@media (max-width:820px){
  body{font-size:15px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(170px,42%) minmax(0,1fr) auto;
    grid-template-areas:"top" "stage" "panel" "tabs"}
  .app[data-tray]{--tray-h:0px}
  .top{gap:8px 10px;padding-block:8px}
  .brand h1{font-size:18px}
  .brand p{font-size:11.5px}
  .brand-mark{width:30px;height:30px}
  .conn{display:none}
  .brand{flex:1 1 0}
  .seg{margin-left:auto}
  .seg button{padding:0 12px;height:32px;font-size:13px}
  .seg .l{display:none}
  .seg .s{display:inline}
  .top .search{order:3;flex:1 1 100%;max-width:none;height:36px}
  .search kbd{display:none}
  .stage{border-right:0;border-bottom:1px solid var(--line)}
  .side,.tray{grid-area:panel;border:0}
  .app[data-mtab="tray"] .side{display:none}
  .app[data-mtab="list"] .tray,.app[data-mtab="ficha"] .tray{display:none}
  .app .tray-body{display:block!important}
  .tray .grp{flex:1 1 100%}
  .tray .grp .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .tray .grp .tile{width:auto}
  .tray-title svg.chev,.tray-size{display:none}
  .tray-hint{display:none}
  .mtabs{grid-area:tabs;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mtabs button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px var(--f-body);color:var(--muted)}
  .mtabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
  .mtabs button:disabled{opacity:.35}
  .mtabs .badge{font:500 10px/16px var(--f-mono);min-width:18px;padding:0 4px;border-radius:8px;background:var(--signal);color:var(--signal-ink)}
  .toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .lb{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .lb-info{max-height:46vh;border-left:0;border-top:1px solid var(--line);padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  .lb-nav{width:40px;height:40px}
  .legend-scale{display:none}
  .banner{top:48px;font-size:13.5px}
  .filters{top:8px;left:8px;right:8px}
  .zoom{right:8px;bottom:8px}
  .zoom button{width:36px;height:36px}
  .edit-hint{left:8px;bottom:8px;font-size:12px}
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:14px 14px 0 0;max-height:88%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= almacenamiento: nube (db + assets) ================= */
function makeCloudStore(db, assets) {
  const chains = new Map();
  const queued = (key, fn) => { const p = (chains.get(key) || Promise.resolve()).then(fn, fn); chains.set(key, p.catch(() => {})); return p; };
  const subs = [];
  for (const col of ['points', 'photos', 'notes']) {
    subs.push(db.collection(col).onSnapshot(snap => {
      const m = new Map();
      snap.docs.forEach(d => m.set(d.id, { id: d.id, ...d.data() }));
      S[col] = m; S.loaded[col] = true;
      onData();
    }, err => {
      S.loaded[col] = true;
      if (err && err.code === 'revoked') { S.canWrite = false; S.canUpload = false; }
      showToast('No se pudo leer ' + col + ' (' + (err && err.code || 'error') + '). Recarga la página.');
      onData();
    }));
  }
  return {
    mode: 'cloud',
    set: (col, id, data) => queued(col + '/' + id, () => db.collection(col).doc(id).set(data)),
    patch: (col, id, data) => queued(col + '/' + id, () => db.collection(col).doc(id).update(data)),
    del: (col, id) => queued(col + '/' + id, () => db.collection(col).doc(id).delete()),
    async putBlob(blob) {
      if (!assets) throw { code: 'not_granted' };
      try { return (await assets.upload(blob, { type: blob.type || 'image/jpeg' })).id; }
      catch (e) {
        if (e && e.code === 'store_unavailable') { await new Promise(r => setTimeout(r, 700 + Math.random() * 600)); return (await assets.upload(blob, { type: blob.type || 'image/jpeg' })).id; }
        throw e;
      }
    },
    async delBlob(id) { if (!assets || !id) return; try { await assets.delete(id); } catch {} },
    url: id => id ? '/_blob/' + id : '',
  };
}

/* ================= almacenamiento: local (IndexedDB) ================= */
async function makeLocalStore() {
  const urls = new Map();
  let idb = null;
  try {
    idb = await new Promise((res, rej) => {
      const r = indexedDB.open('plano-fotografico', 1);
      r.onupgradeneeded = () => ['points', 'photos', 'notes', 'blobs'].forEach(n => r.result.createObjectStore(n));
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch { idb = null; }
  const tx = (name, mode, fn) => new Promise((res, rej) => {
    if (!idb) return res(null);
    try { const t = idb.transaction(name, mode); const r = fn(t.objectStore(name)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }
    catch (e) { rej(e); }
  });
  const all = async name => {
    if (!idb) return [];
    const [keys, vals] = await Promise.all([tx(name, 'readonly', s => s.getAllKeys()), tx(name, 'readonly', s => s.getAll())]);
    return (keys || []).map((k, i) => [k, vals[i]]);
  };
  const strip = o => { const c = { ...o }; delete c.id; return c; };
  for (const col of ['points', 'photos', 'notes']) {
    const m = new Map(); (await all(col)).forEach(([k, v]) => m.set(k, { id: k, ...v })); S[col] = m; S.loaded[col] = true;
  }
  (await all('blobs')).forEach(([k, b]) => urls.set(k, URL.createObjectURL(b)));
  if (!S.points.size && !LS.get('localSeeded', false)) {
    for (const p of basePointDocs()) { S.points.set(p.id, p); await tx('points', 'readwrite', s => s.put(strip(p), p.id)); }
    LS.set('localSeeded', true);
  }
  return {
    mode: idb ? 'local' : 'memory',
    async set(col, id, data) { S[col].set(id, { id, ...data }); onData(); await tx(col, 'readwrite', s => s.put(data, id)); },
    async patch(col, id, data) { const cur = S[col].get(id); if (!cur) throw { code: 'invalid_argument' }; const nx = { ...cur, ...data }; S[col].set(id, nx); onData(); await tx(col, 'readwrite', s => s.put(strip(nx), id)); },
    async del(col, id) { S[col].delete(id); onData(); await tx(col, 'readwrite', s => s.delete(id)); },
    async putBlob(blob) { const id = rid(); urls.set(id, URL.createObjectURL(blob)); await tx('blobs', 'readwrite', s => s.put(blob, id)); return id; },
    async delBlob(id) { if (!id) return; const u = urls.get(id); if (u) URL.revokeObjectURL(u); urls.delete(id); await tx('blobs', 'readwrite', s => s.delete(id)); },
    url: id => urls.get(id) || '',
  };
}
function basePointDocs() {
  const now = Date.now();
  return BASE_POINTS.map(([code, name, sector, x, y, equipo]) => ({
    id: 'p' + code.slice(2), code, name, sector, equipo, descripcion: '',
    x: +(x / PLAN.w).toFixed(4), y: +(y / PLAN.h).toFixed(4), createdAt: now, updatedAt: now,
  }));
}

const allPhotos = () => [...S.photos.values()];
const byDateDesc = (a, b) => (b.capturedAt || b.uploadedAt || 0) - (a.capturedAt || a.uploadedAt || 0);
const photosOf = pid => allPhotos().filter(p => p.pointId === pid).sort(byDateDesc);
const trayPhotos = () => allPhotos().filter(p => !p.pointId || !S.points.has(p.pointId)).sort(byDateDesc);
const notesOf = pid => [...S.notes.values()].filter(n => n.pointId === pid).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const sortedPoints = () => [...S.points.values()].sort((a, b) => String(a.code).localeCompare(String(b.code), 'es', { numeric: true }));
const counts = () => { const m = new Map(); for (const p of S.photos.values()) if (p.pointId && S.points.has(p.pointId)) m.set(p.pointId, (m.get(p.pointId) || 0) + 1); return m; };
const num = code => { const d = String(code || '').match(/\d+/); return d ? String(+d[0]) : String(code || '?').slice(0, 2); };
const num3 = code => { const d = String(code || '').match(/\d+/); return d ? d[0].padStart(3, '0') : String(code || ''); };
const secOf = p => SEC[p && p.sector] || SEC.apoyo;
const ptTitle = p => p ? `Punto ${num3(p.code)} · ${p.name}` : 'Bandeja';
const photoUrl = p => store ? store.url(p.assetId) : '';
const thumbUrl = p => store ? store.url(p.thumbId || p.assetId) : '';
const whoName = id => !id ? (S.storeMode === 'cloud' ? 'Carga inicial' : 'Tú') : (S.names[id] || (id === S.me ? 'Tú' : 'Alguien del equipo'));
function matches(p, c) {
  if (!S.filters.has(p.sector) && SEC[p.sector]) return false;
  if (S.onlyPhotos && !(c.get(p.id) > 0)) return false;
  if (S.q) { const hay = norm([p.code, p.name, p.equipo, secOf(p).n, p.descripcion].join(' ')); return norm(S.q).split(/\s+/).every(t => hay.includes(t)); }
  return true;
}
function sessions(list) {
  const out = []; let cur = null;
  for (const p of list) {
    const t = p.capturedAt || p.uploadedAt || 0;
    if (cur && Math.abs(cur.last - t) <= SESSION_GAP) { cur.items.push(p); cur.last = t; cur.start = Math.min(cur.start, t); }
    else { cur = { items: [p], end: t, start: t, last: t }; out.push(cur); }
  }
  return out;
}

let clusterS = 0;
function clusters(pts) {
  const R = 30 / V.s, out = [], used = new Set();
  for (const p of pts) {
    if (used.has(p.id)) continue;
    used.add(p.id);
    if (p.id === S.sel) { out.push([p]); continue; }
    const g = [p];
    for (let i = 0; i < g.length; i++) {
      const a = g[i];
      for (const q of pts) {
        if (used.has(q.id) || q.id === S.sel) continue;
        if (Math.hypot((q.x - a.x) * PLAN.w, (q.y - a.y) * PLAN.h) < R) { g.push(q); used.add(q.id); }
      }
    }
    out.push(g);
  }
  return out;
}
function markerHTML(p, c) {

    style="left:${(p.x * PLAN.w).toFixed(1)}px;top:${(p.y * PLAN.h).toFixed(1)}px;--c:${s.c}" aria-label="${esc(ptTitle(p))}, ${plural(n, 'foto', 'fotos')}">

function clusterHTML(g, c) {
  g = g.slice().sort((a, b) => SECTORS.indexOf(secOf(a)) - SECTORS.indexOf(secOf(b)));
  const x = g.reduce((t, p) => t + p.x, 0) / g.length * PLAN.w, y = g.reduce((t, p) => t + p.y, 0) / g.length * PLAN.h;
  const n = g.reduce((t, p) => t + (c.get(p.id) || 0), 0), step = 360 / g.length;
  const grad = g.map((p, i) => `${secOf(p).c} ${(i * step).toFixed(1)}deg ${((i + 1) * step).toFixed(1)}deg`).join(',');
  const names = g.map(p => p.name).join(', ');
  return `<button type="button" class="mk cl${g.some(p => matches(p, c)) ? '' : ' dim'}" data-cluster="${g.map(p => esc(p.id)).join(',')}"
    style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;--g:conic-gradient(${grad})" aria-label="${g.length} puntos: ${esc(names)}. Toca para acercar.">
    <span class="cl-dot"><b>${g.length}</b></span>${n ? `<span class="mk-count">${n}</span>` : ''}<span class="mk-label">${esc(g.length + ' puntos · toca para acercar')}</span></button>`;
}
function renderMarkers(c) {

function zoomCluster(ids) {
  const pts = ids.map(id => S.points.get(id)).filter(Boolean); if (!pts.length) return;
  const xs = pts.map(p => p.x * PLAN.w), ys = pts.map(p => p.y * PLAN.h);

function tileHTML(ph, ctx, i) {

}

function fichaPhotosHTML(p, photos) {

function histHTML(p, photos) {
  if (!photos.length) return `<div class="empty-state"><h3>Sin historial</h3><p>El historial se arma solo con la fecha de captura de cada foto.</p></div>`;
  let h = `<div class="hist-tools"><p>${plural(photos.length, 'foto', 'fotos')} ordenadas por fecha de captura.</p>
    ${photos.length > 1 ? `<button type="button" class="btn sm" data-act="compare">${ICON.cmp}Antes / después</button>` : ''}</div><div class="hist">`;
  let month = '', i = 0;
  const days = [];
  for (const ph of photos) {
    const t = ph.capturedAt || ph.uploadedAt; const d = new Date(t); const dk = d.toDateString();
    const last = days[days.length - 1];
    if (last && last.key === dk) last.items.push(ph); else days.push({ key: dk, t, items: [ph] });
  }
  for (const d of days) {
    const m = F.month.format(d.t);
    if (m !== month) { h += `<h4>${esc(cap(m))}</h4>`; month = m; }
    const who = [...new Set(d.items.map(x => x.author || whoName(x.by)))].join(', ');
    h += `<div class="hday"><div class="hdate"><b>${new Date(d.t).getDate()}</b><span>${esc(F.wd.format(d.t).replace('.', ''))}</span></div>
      <div class="hbody"><b>${plural(d.items.length, 'foto', 'fotos')}</b><small>${esc(F.time.format(d.t))} · ${esc(who)}</small>
      <div class="hstrip">${d.items.map(ph => tileHTML(ph, 'hist', i++)).join('')}</div></div></div>`;
  }
  return h + '</div>';
}

/* ---------- toast ---------- */
let toastTimer = 0;
function showToast(msg, undo) {
  S.toast = { msg, undo: !!undo }; if (!undo) S.undo = null; else S.undo = undo;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; S.undo = null; render(); }, undo ? 7000 : 4500);
  render();
}
function renderToast() {
  const t = $('#toast');
  if (!S.toast) { t.hidden = true; return; }
  t.hidden = false;
  setHTML(t, `<span>${esc(S.toast.msg)}</span>${S.toast.undo ? `<button type="button" class="btn sm" data-act="undo">Deshacer</button>` : ''}`);
}

/* ================= acciones ================= */
function errMsg(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' || c === 'not_granted') return 'No se pudo guardar: falta permiso de edición o el elemento ya no existe.';
  if (c === 'quota_exceeded' || c === 'quota_or_state') return 'Se llenó el espacio disponible. Elimina fotos antiguas o ejemplos para seguir.';
  if (c === 'too_large') return 'La foto es demasiado grande (máx. 20 MB).';
  if (c === 'rate_limited' || c === 'resource_exhausted') return 'Demasiadas operaciones seguidas. Espera unos segundos.';
  if (c === 'unsupported_type') return 'Formato de imagen no compatible. Usa JPG o PNG.';
  return 'No se pudo guardar el cambio. Revisa la conexión e inténtalo otra vez.';
}
async function safe(fn) {
  try { return await fn(); }
  catch (e) { showToast(errMsg(e)); console.warn(e); return undefined; }
}

function selectPoint(id, fly) {
  S.sel = id; S.mtab = 'ficha'; S.armed = null;
  if (S.selCtx === 'ficha') { S.selection.clear(); S.selCtx = null; }
  render();
  if (fly) flyToPoint(id);
  const sc = $('#fScroll'); if (sc) sc.scrollTop = 0;
}

async function assignPhotos(ids, pid) {
  ids = ids.filter(id => S.photos.has(id));
  if (!ids.length) return;
  const prev = ids.map(id => ({ id, prev: S.photos.get(id).pointId || null }));
  S.assign = null; S.picker = null; S.selection.clear(); S.selCtx = null;
  render();
  const now = Date.now();
  await safe(() => Promise.all(ids.map(id => store.patch('photos', id, { pointId: pid || null, updatedAt: now }))));
  const pt = pid && S.points.get(pid);
  showToast(pt ? `${plural(ids.length, 'foto ubicada', 'fotos ubicadas')} en ${ptTitle(pt)}` : `${plural(ids.length, 'foto devuelta', 'fotos devueltas')} a la bandeja`, { ops: prev });
}
async function undo() {
  const u = S.undo; if (!u) return;
  S.undo = null; S.toast = null; render();
  await safe(() => Promise.all(u.ops.map(o => S.photos.has(o.id) && store.patch('photos', o.id, { pointId: o.prev, updatedAt: Date.now() }))));
  showToast('Cambio deshecho');
}
async function deletePhotos(ids) {
  ids = ids.filter(id => S.photos.has(id));
  S.selection.clear(); S.selCtx = null; S.armed = null; render();
  let ok = 0;
  for (const id of ids) {
    const ph = S.photos.get(id); if (!ph) continue;
    const r = await safe(async () => { await store.del('photos', id); return true; });
    if (r) { ok++; await store.delBlob(ph.assetId); if (ph.thumbId && ph.thumbId !== ph.assetId) await store.delBlob(ph.thumbId); }
  }
  if (ok) showToast(`${plural(ok, 'foto eliminada', 'fotos eliminadas')}`);
}
async function createPoint(x, y) {
  const used = new Set([...S.points.values()].map(p => p.code));
  let k = S.points.size + 1; while (used.has('P-' + String(k).padStart(3, '0'))) k++;
  const id = 'p' + rid(), now = Date.now();
  const data = { code: 'P-' + String(k).padStart(3, '0'), name: 'Nuevo punto', sector: 'apoyo', equipo: '', descripcion: '', x: +x.toFixed(4), y: +y.toFixed(4), createdAt: now, updatedAt: now };
  const r = await safe(async () => { await store.set('points', id, data); return true; });
  if (!r) return;
  S.fichaTab = 'fotos'; selectPoint(id, false);

function exifDate(buf) {

}

  if (!list.length) return showToast('No encontré imágenes en lo que elegiste.');
  if (!S.canUpload || !S.canWrite) return showToast('No tienes permiso para subir fotos en este plano.');
  const pt = pid && S.points.get(pid);
  if (S.up.done + S.up.failed >= S.up.total) S.up = { total: 0, done: 0, failed: 0 };

  const errors = [];
  let ok = 0;

    try {
      let date = null;
      try { date = exifDate(await f.slice(0, 256 * 1024).arrayBuffer()); } catch {}
      const d = await decodeImage(f);
      const full = await toJpeg(d, 2048, 0.84), thumb = await toJpeg(d, 480, 0.78);

    case 'close-ficha': S.sel = null; S.mtab = 'list'; if (S.selCtx === 'ficha') { S.selection.clear(); S.selCtx = null; } render(); break;
    case 'fly': S.sel && flyToPoint(S.sel); if (isMobile()) $('#vp').scrollIntoView({ block: 'nearest' }); break;
    case 'ftab': S.fichaTab = el.dataset.tab; if (S.selCtx === 'ficha') { S.selection.clear(); S.selCtx = null; } render(); break;
    case 'mtab': S.mtab = el.dataset.tab; if (S.mtab === 'tray' && S.tray === 'min') S.tray = 'mid'; render(); break;
    case 'toggle': toggleSel(el.dataset.id, el.dataset.ctx); break;
    case 'open': openPhoto(el.dataset.id, el.dataset.ctx); break;
    case 'sel-group': {
      const ids = el.dataset.ids.split(',');
      if (S.selCtx !== 'tray') { S.selection.clear(); S.selCtx = 'tray'; }
      const all = ids.every(id => S.selection.has(id));
      ids.forEach(id => all ? S.selection.delete(id) : S.selection.add(id));
      if (!S.selection.size) S.selCtx = null; render(); break;
    }
    case 'sel-all': S.selection = new Set(trayPhotos().map(p => p.id)); S.selCtx = 'tray'; render(); break;
    case 'sel-clear': S.selection.clear(); S.selCtx = null; render(); break;
    case 'assign':
      S.assign = { ids: [...S.selection] }; render(); break;
    case 'pick-list': S.picker = { ids: S.assign ? S.assign.ids : [...S.selection], q: '' }; render(); break;
    case 'pick': assignPhotos(S.picker.ids, el.dataset.id); break;
    case 'pick-close': S.picker = null; render(); break;
    case 'cancel-assign': S.assign = null; render(); break;
    case 'to-tray': assignPhotos([...S.selection], null); break;
    case 'delete-sel': deletePhotos([...S.selection]); break;
    case 'clear-examples': deletePhotos(allPhotos().filter(p => p.example).map(p => p.id)); break;
    case 'upload': uploadTarget = el.dataset.point || null; $('#fileIn').click(); break;
    case 'tray-toggle': if (!isMobile()) { S.tray = S.tray === 'min' ? 'mid' : 'min'; LS.set('tray', S.tray); render(); } break;
    case 'tray-size': S.tray = S.tray === 'max' ? 'mid' : 'max'; LS.set('tray', S.tray); render(); break;
    case 'filter': {
      const k = el.dataset.k;
      if (S.filters.size === SECTORS.length) S.filters = new Set([k]);
      else { S.filters.has(k) ? S.filters.delete(k) : S.filters.add(k); if (!S.filters.size) S.filters = new Set(SECTORS.map(s => s.k)); }
      render(); break;
    }
    case 'filter-all': S.filters = new Set(SECTORS.map(s => s.k)); render(); break;
    case 'only-photos': S.onlyPhotos = !S.onlyPhotos; render(); break;
    case 'clear-search': S.q = ''; $('#q').value = ''; S.filters = new Set(SECTORS.map(s => s.k)); S.onlyPhotos = false; render(); break;
    case 'zoom-in': zoomBtn(1.6); break;
    case 'zoom-out': zoomBtn(1 / 1.6); break;
    case 'zoom-fit': userMoved = false; fitPoints(true); break;
    case 'labels': S.labels = !S.labels; LS.set('labels', S.labels); applyView(); render(); break;
    case 'del-point': deletePoint(S.sel); break;
    case 'load-base': loadBase(); break;
    case 'del-note': safe(() => store.del('notes', el.dataset.id)); break;
    case 'compare': { const ph = photosOf(S.sel); if (ph.length > 1) { S.cmp = { pid: S.sel, a: ph[ph.length - 1].id, b: ph[0].id }; render(); } break; }
    case 'cmp-close': S.cmp = null; render(); break;
    case 'lb-close': closeLb(); break;
    case 'lb-prev': lbStep(-1); break;
    case 'lb-next': lbStep(1); break;
    case 'lb-delete': { const id = S.lb && S.lb.id; if (id) { lbStep(1); if (S.lb && S.lb.id === id) S.lb = null; deletePhotos([id]); } break; }
    case 'undo': undo(); break;
  }
});
let armTimer = 0;

document.addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea,select');
  if (e.key === 'Escape') {
    if (pd && pd.started) { pd = null; endDragUI(); return; }
    if (S.lb) return closeLb();
    if (S.picker || S.cmp) { S.picker = null; S.cmp = null; return render(); }
    if (S.assign) { S.assign = null; return render(); }
    if (S.selection.size) { S.selection.clear(); S.selCtx = null; return render(); }
    if (typing) return e.target.blur();
    if (S.sel) { S.sel = null; S.mtab = 'list'; return render(); }
    return;
  }
  if (S.lb && !typing) { if (e.key === 'ArrowLeft') lbStep(-1); if (e.key === 'ArrowRight') lbStep(1); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === '+' || e.key === '=') zoomBtn(1.4);
  else if (e.key === '-') zoomBtn(1 / 1.4);
  else if (e.key === '0') { userMoved = false; fitPoints(true); }
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tile')) { e.preventDefault(); e.target.click(); }
});

/* ---------- formularios ---------- */
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
$('#q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const c = counts(); const p = sortedPoints().find(p => matches(p, c));
  if (p) { selectPoint(p.id, true); e.target.blur(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.field && S.sel) {
    const v = t.value.trim();
    if (t.dataset.field === 'code' && !v) return;
    if (t.dataset.field === 'name' && !v) { t.value = S.points.get(S.sel).name; return; }
    safe(() => store.patch('points', S.sel, { [t.dataset.field]: v, updatedAt: Date.now() }));
    if (t.dataset.field === 'sector') { $('#fHead')._html = null; t.blur(); }
    return;
  }
  if (S.lb && t.closest('#lbInfo')) {
    const id = S.lb.id; const ph = S.photos.get(id); if (!ph) return;
    if (t.id === 'lbPoint') { const pid = t.value || null; t.blur(); assignPhotos([id], pid); return; }
    if (t.id === 'lbDate' && t.value) { const ms = new Date(t.value).getTime(); if (!isNaN(ms)) safe(() => store.patch('photos', id, { capturedAt: ms, dateSource: 'manual', updatedAt: Date.now() })); }
    if (t.id === 'lbAuthor') safe(() => store.patch('photos', id, { author: t.value.trim().slice(0, 80), updatedAt: Date.now() }));
    if (t.id === 'lbCaption') safe(() => store.patch('photos', id, { caption: t.value.trim().slice(0, 1000), updatedAt: Date.now() }));
    return;
  }
  if (t.id === 'cmpSelA' || t.id === 'cmpSelB') { S.cmp[t.id === 'cmpSelA' ? 'a' : 'b'] = t.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pkQ') { S.picker.q = e.target.value; render(); }
  if (e.target.id === 'cmpPos') $('#cmpBox').style.setProperty('--pos', e.target.value + '%');
});
document.addEventListener('focusout', e => { if (e.target.closest && (e.target.closest('#fHead') || e.target.closest('#lbInfo'))) setTimeout(render, 0); });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'noteForm') return;
  e.preventDefault();
  const ta = $('#noteIn'); const text = ta.value.trim(); if (!text || !S.sel) return;
  const r = await safe(async () => { await store.set('notes', rid(), { pointId: S.sel, text: text.slice(0, 2000), by: S.me || null, createdAt: Date.now() }); return true; });
  if (r) { ta.value = ''; ta.blur(); showToast('Observación agregada'); }
});

/* swipe en el visor */
let sw = null;
document.addEventListener('pointerdown', e => { if (S.lb && e.target.closest('#lbStage') && !e.target.closest('button')) sw = { x: e.clientX, y: e.clientY }; });
document.addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) lbStep(dx < 0 ? 1 : -1);
});

/* ================= arranque ================= */
async function start() {
  S.mode = LS.get('mode', 'view') === 'edit' ? 'edit' : 'view';
  if (isMobile()) S.mtab = 'tray';
  computeFit(); Object.assign(V, viewRect(0, 0, PLAN.w, PLAN.h, 8)); applyView();
  render();
  const C = window.claude;
  let db = null, assets = null;
  if (C && typeof C.use === 'function') {
    [db, assets, U] = await Promise.all([C.use('db'), C.use('assets'), C.use('user')].map(p => p.catch(() => null)));
  }
  if (db) {
    S.storeMode = 'cloud';
    if (U) {
      try { S.me = await U.id(); } catch {}
      try { const w = await U.can('data.write'); if (w === false) S.canWrite = false; } catch {}
    }
    S.canUpload = !!assets && S.canWrite;
    store = makeCloudStore(db, assets);
  } else {
    store = await makeLocalStore();
    S.storeMode = store.mode; S.canWrite = true; S.canUpload = true;
  }
  if (!S.canWrite) S.mode = 'view';
  render();
  let waited = 0;
  const firstFit = () => { if (userMoved) return; if (S.loaded.points || waited > 40) return fitPoints(true); waited++; setTimeout(firstFit, 100); };
  firstFit();
}
start();
})();
</script>
