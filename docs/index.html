<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Market IA">
  <title>Market Intelligence AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📈</span>
      <div>
        <div class="title">Market Intelligence AI</div>
        <div class="sub" id="dataStatus">Cargando datos…</div>
      </div>
    </div>
    <button class="icon-btn" id="btnRefresh" title="Actualizar" aria-label="Actualizar">⟳</button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="cartera" class="active"><span>💼</span>Cartera</button>
    <button data-tab="radar"><span>🎯</span>Radar</button>
    <button data-tab="hoy"><span>📰</span>Hoy</button>
    <button data-tab="ia"><span>🤖</span>IA</button>
    <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div id="page" class="page" hidden>
    <div id="pageContent"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
