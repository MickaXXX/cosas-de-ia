/* ---------- Asesoría ---------- */
function rAsesoria(el){
  const rk = ranking();
  if (!rk.length){ el.innerHTML = '<div class="panel">No hay unidades con estos filtros.</div>'; return; }
  const by = (f, dir) => rk.slice().sort((a, b) => dir * (f(b) - f(a)))[0];
  const pres = rk.filter(x => x.plan.best);
  const cerca = rk.filter(x => x.plan.sinDeuda).sort((a, b) => a.plan.sinDeuda.w - b.plan.sinDeuda.w || a.plan.sinDeuda.llaves - b.plan.sinDeuda.llaves)[0];
  const top = rk[0];
  const flujo = by(x => x.r.flujo1, 1);
  const plus = by(x => sect(x.p.sector).plus * 10 + (isFinite(x.r.tir) ? x.r.tir : 0), 1);
  const barato = by(x => -x.r.invIni, 1);
  const best1 = rk.find(x => x.u.d === 1), best2 = rk.find(x => x.u.d === 2);
  const inm = rk.find(x => x.p.estado === 'inmediata'), verde = rk.find(x => x.p.estado !== 'inmediata');
  const pos = rk.filter(x => x.r.flujo1 >= 0).length;
  const capVsTasa = rk.filter(x => x.r.capRate < x.r.tasa / 100).length;
  const pick = (tag, x, extra) => x ? `<div class="pick"><div class="tag">${esc(tag)}</div><div class="pn">${esc(x.p.n)} · ${esc(x.u.t)}</div><div class="small muted" style="text-align:right">#${x.rank} · ${NF0.format(x.score)} pts</div>
    <div class="small ink2" style="grid-column:1/-1">${esc(x.p.inmo)}, ${esc(sect(x.p.sector).n)}. ${NF1.format(x.u.m2)} m² en ${ufF(x.u.uf, 0)}. Pie ${clpM(x.r.piePago * S.uf)}, dividendo ${clp(x.r.div1 * S.uf)}, arriendo estimado ${clp(x.r.rent)}, flujo ${clpS(x.r.flujo1 * S.uf)} al mes, TIR ${pct(x.r.tir)}. ${extra || ''}</div></div>` : '';
  el.innerHTML = `<div class="grid g-wide">
  <div class="panel memo">
    <h3>Recomendación de hoy</h3>
    <p>Con pie de ${NF0.format(S.pie * 100)}%, crédito a ${S.plazo} años con ${S.banco === 'mejor' ? 'la mejor tasa disponible' : esc(BANCOS.find(b => b.id === S.banco).n)} y venta a ${S.horizonte} años, la mejor opción ${esc(C().prefEn)} es <b>${esc(top.p.n)} ${esc(top.u.t)}</b>. ${esc(porQue(top))}</p>
    <p>${pos} de ${rk.length} unidades se pagan solas desde el primer mes. En ${capVsTasa} de ${rk.length} el cap rate es menor que la tasa del crédito: ahí la ganancia viene de la plusvalía y de la deuda que amortiza el arrendatario, no del flujo.</p>
    <p>Tu realidad hoy: el banco ve una renta de ${clp(rentaComp())}, tienes ${clpM(S.ahorro)} y ahorras ${clpM(S.ahorroMes)} al mes. ${pres.length} de ${rk.length} unidades tienen un camino viable${cerca ? '. La que puedes concretar antes sin deuda de consumo es <b>' + esc(cerca.p.n) + ' ' + esc(cerca.u.t) + '</b>: ' + (cerca.plan.sinDeuda.w === 0 ? 'firmas hoy' : 'firmas en ' + fechaEn(cerca.plan.sinDeuda.w)) + ' y recibes en ' + fechaEn(cerca.plan.sinDeuda.llaves) + ' (' + esc(caminoCorto(cerca.plan.sinDeuda)) + ')' : ''}. El detalle está en Mi situación.</p>
    <div>${pick('Mejor opción global', top)}${pick('Mejor flujo mensual', flujo, flujo.r.flujo1 >= 0 ? 'El arriendo cubre el dividendo y todos los costos.' : 'Incluso la mejor requiere aportar cada mes.')}${pick('Mayor potencial de plusvalía', plus, 'Sector con ' + NF1.format(sect(plus.p.sector).plus) + '% real anual estimado.')}${pick('Menor capital inicial', barato, 'Inversión inicial de ' + clpM(barato.r.invIni * S.uf) + ' incluyendo gastos.')}${best1 && best1 !== top ? pick('Mejor 1 dormitorio', best1) : ''}${best2 && best2 !== top ? pick('Mejor 2 dormitorios', best2) : ''}</div>
    <h3>Entrega inmediata o en verde</h3>
    <p>${inm ? 'La mejor con entrega inmediata es <b>' + esc(inm.p.n) + ' ' + esc(inm.u.t) + '</b> (#' + inm.rank + '): arriendas desde el primer mes y ves el producto terminado.' : ''} ${verde ? 'La mejor en verde o en blanco es <b>' + esc(verde.p.n) + ' ' + esc(verde.u.t) + '</b> (#' + verde.rank + '): pagas el pie en cuotas y capturas plusvalía durante la obra, a cambio de riesgo de plazo y de no recibir arriendo hasta la entrega.' : ''}</p>
    <h3>Plan de acción</h3>
    <ol class="steps">
      <li><div><b>Preaprueba tu crédito en tres bancos.</b> Pide cotización formal con CAE a BancoEstado, Santander y BCI (o Itaú). Entrega la misma información a todos y compara dividendo y seguros.</div></li>
      <li><div><b>Confirma qué incluye el precio.</b> Pregunta por estacionamiento, bodega, terminaciones y gastos comunes reales del edificio. ${(() => { const ap = PROYECTOS.filter(q => q.estac && q.estac.incl === false).map(q => esc(q.n)); return ap.length ? 'En ' + ap.join(' y ') + ' el estacionamiento se paga aparte.' : ''; })()}</div></li>
      <li><div><b>Negocia.</b> Hay inmobiliarias con descuentos de lanzamiento de 12% a 17% y bonos pie, y el stock final de edificios terminados suele tener margen. Pide el descuento por escrito en la cotización.</div></li>
      <li><div><b>Valida el arriendo.</b> Busca 5 avisos de departamentos similares en el mismo edificio o cuadra. Si el arriendo real es 10% menor que el estimado, revisa el escenario pesimista.</div></li>
      <li><div><b>Protege la compra en verde.</b> Exige que el pie quede respaldado por póliza de seguro o boleta de garantía, revisa la fecha de recepción municipal y la trayectoria de la inmobiliaria.</div></li>
      <li><div><b>Arma un fondo de reserva.</b> Guarda al menos 6 dividendos para vacancia, reparaciones o un alza de gastos comunes.</div></li>
    </ol>
    <h3>Riesgos que no se ven en la planilla</h3>
    <ul class="clean">
      ${C().riesgos.map(r => '<li><b>' + esc(r[0]) + '.</b> ' + esc(r[1]) + '</li>').join('')}
      <li><b>Subsidios.</b> El subsidio a la tasa y FOGAES son para la primera vivienda. Si compras con subsidio DS19, rigen prohibiciones de venta; para un departamento de inversión evalúa sin subsidio.</li>
      <li><b>Datos de este informe.</b> Precios "desde" de portales a ${esc(FECHA_DATOS)}. Las unidades marcadas como Verificar o Dato parcial necesitan confirmación en sala de ventas.</li>
    </ul>
  </div>
  <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
    <div class="panel"><h2>Estudio de mercado</h2><p class="sub">${esc(C().n)}, ${esc(FECHA_DATOS)}.</p>
      ${MERCADO.map(m => `<div class="fact"><div class="fv">${esc(m.v)}</div><div><b>${esc(m.t)}</b></div><div class="fd">${esc(m.d)}</div><a href="${esc(m.f)}" target="_blank" rel="noopener">Fuente</a></div>`).join('')}
      ${S.city !== 'antofagasta' ? '' : `<div class="fact"><div class="fv">2.100–3.100 · 4.800–6.350 · 7.500–11.900 UF</div><div><b>Rangos de precio por subzona</b></div><div class="fd">Inversión (Antilhue, Coviefi Alto) · medio (Cerro Paranal, Llacolén) · premium (Av. Brasil, Jardines del Sur).</div></div>`}
    </div>
    <div class="panel"><h2>Indicadores, en simple</h2>
      <ul class="clean small">
        <li><b>Dividendo:</b> cuota del crédito más seguros de desgravamen e incendio y sismo.</li>
        <li><b>Cap rate:</b> arriendo neto anual dividido por el precio. Mide la renta sin considerar el crédito.</li>
        <li><b>Flujo mensual:</b> lo que te queda (o pones) después de pagar dividendo, vacancia, mantención y contribuciones.</li>
        <li><b>Cash-on-cash:</b> flujo anual dividido por el capital que pusiste (pie más gastos).</li>
        <li><b>TIR:</b> rentabilidad anual de todo el ciclo: pie, flujos y venta. Está en UF, o sea, sobre la inflación.</li>
        <li><b>VAN:</b> cuánto vale hoy la inversión por sobre una alternativa que rinde ${NF0.format(S.desc * 100)}% real.</li>
        <li><b>PER:</b> años de arriendo bruto para pagar el precio. Bajo 18 es atractivo en Chile.</li>
        <li><b>Arriendo de equilibrio:</b> arriendo mínimo para que el flujo sea cero.</li>
      </ul></div>
  </div></div>`;
}

/* ---------- Supuestos ---------- */
function rSupuestos(el){
  const f = (id, l, v, step, hint, scale) => `<div class="field"><label for="${id}">${l}</label><input id="${id}" type="number" step="${step}" value="${+(v * (scale || 1)).toFixed(6)}" data-sup="${id}" data-scale="${scale || 1}">${hint ? '<span class="hint">' + hint + '</span>' : ''}</div>`;
  const secIds = Object.keys(SECTORES);
  el.innerHTML = `
  <div class="panel"><h2>Supuestos del modelo</h2><p class="sub">Se guardan en este navegador. Los porcentajes se ingresan como número (5 = 5%).</p>
    <div class="frow">
      ${f('uf', 'Valor UF ($)', S.uf, 0.01, 'UF del ' + FECHA_DATOS + ': $41.081,76')}
      ${f('horizonte', 'Horizonte de venta (años)', S.horizonte, 1, 'Desde la entrega')}
      ${f('desc', 'Tasa de descuento real (%)', S.desc, 0.1, 'Para el VAN', 100)}
      ${f('vac', 'Vacancia (%)', S.vac, 0.5, '5% ≈ 18 días al año', 100)}
      ${f('mant', 'Mantención (% del arriendo)', S.mant, 0.5, '', 100)}
      ${f('corr', 'Corretaje anualizado (%)', S.corr, 0.5, 'Medio mes por contrato cada 2 años', 100)}
      ${f('costoVenta', 'Costo de venta (%)', S.costoVenta, 0.5, 'Corretaje al vender', 100)}
      ${f('desg', 'Seguro desgravamen (% mensual s/saldo)', S.desg, 0.001, '', 100)}
      ${f('inc', 'Seguro incendio y sismo (% mensual)', S.inc, 0.001, 'Sobre 80% del precio', 100)}
      ${f('gastosFijos', 'Gastos fijos de compra (UF)', S.gastosFijos, 1, 'Tasación, estudio de títulos, notaría')}
      ${f('cbr', 'Conservador de Bienes Raíces (%)', S.cbr, 0.05, '', 100)}
      ${f('ite', 'Impuesto al mutuo (%)', S.ite, 0.1, 'Timbres y estampillas', 100)}
      ${f('divRenta', 'Dividendo máximo sobre renta (%)', S.divRenta, 1, 'Criterio bancario usual', 100)}
      ${f('cargaMax', 'Carga financiera máxima (%)', S.cargaMax, 1, 'Dividendo + otras deudas', 100)}
      ${f('rentGrowth', 'Alza real del arriendo (% anual)', S.rentGrowth, 0.1, 'Sobre la UF', 100)}
    </div>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="supReset" type="button">Restablecer todos los supuestos</button></div></div>
  <div class="panel"><h2>Supuestos por sector · ${esc(C().n)}</h2><p class="sub">Arriendo de referencia sin gastos comunes para un 1D1B de 38 m² y un 2D2B de 60 m². Se ajusta por superficie con elasticidad 0,45 (un depto 20% más grande arrienda cerca de 9% más).</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sector</th><th>Zona</th><th class="n">Arriendo 1D $</th><th class="n">Arriendo 2D $</th><th class="n">GC $/m²</th><th class="n">Plusvalía % real</th><th class="n">Seguridad 0–100</th></tr></thead>
    <tbody>${secIds.map(id => { const s = sect(id); return `<tr><td><b>${esc(s.n)}</b></td><td>${s.sur ? esc(C().pref) : esc(C().otra)}</td>${['arr1', 'arr2', 'gc', 'plus', 'seg'].map(k => `<td class="n" style="min-width:110px"><input type="number" step="${k === 'plus' ? 0.1 : k === 'seg' ? 1 : k === 'gc' ? 50 : 10000}" value="${s[k]}" data-sec="${id}" data-k="${k}" aria-label="${esc(s.n)} ${k}"></td>`).join('')}</tr>`; }).join('')}</tbody></table></div></div>
  <div class="grid g2">
    <div class="panel"><h2>Cómo se calcula</h2>
      <ul class="clean small">
        <li>Dividendo: sistema francés con tasa mensual = anual/12, más desgravamen sobre el saldo e incendio y sismo sobre el 80% del precio.</li>
        <li>Todo se modela en UF: arriendo, deuda y precio se reajustan con la inflación, así que la TIR es real.</li>
        <li>Gastos operacionales: gastos fijos + CBR sobre el precio + impuesto al mutuo sobre el crédito.</li>
        <li>Contribuciones: (55% del precio − exención) × 0,98% anual, con 50% de rebaja DFL2.</li>
        <li>En verde y en blanco: el pie se paga en cuotas hasta la entrega (si lo activas), sin arriendo ni dividendo en ese período; la plusvalía corre desde hoy.</li>
        <li>Venta al final del horizonte: valor con plusvalía menos 2% de costo y menos el saldo de la deuda.</li>
        <li>El ranking normaliza cada criterio de 0 a 100 entre las unidades visibles y pondera con tus pesos.</li>
      </ul></div>
    <div class="panel"><h2>Fuentes generales</h2>
      <ul class="clean src">
        ${['https://www.pauta.cl/dato-en-pauta/2026/10/03/valor-de-la-uf-hoy-sabado-3-de-octubre-revisa-el-precio-de-la-unidad-de-fomento.html',
           'https://www.neatpagos.com/blog/articulo/mejor-tasa-credito-hipotecario',
           'https://www.rvc.cl/tasas-hipotecarias-2026-tendencia-a-la-baja/',
           'https://fogaes.cl/sitio/requisitos/',
           'https://www.imagina.cl/blogs/ampliacion-subsidio-hipotecario-fogaes/',
           'https://www.cnnchile.com/pais/antofagasta-la-serena-y-concepcion-superan-a-santiago-en-rentabilidad-para-invertir-en-departamentos/',
           'https://tierramarillano.cl/2026/08/01/ventas-inmobiliarias-en-antofagasta-crecen-70-en-el-primer-semestre/',
           'https://www.coldwellbanker.cl/blog/blog-1/antofagasta-2025-departamentos-usados-218',
           'https://casas.mitula.cl/casas/arriendo-departamentos-zona-sur-antofagasta',
           'https://www.portalinmobiliario.com/arriendo/departamento/antofagasta/antofagasta/playa-blanca'].map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}
      </ul>
      <p class="small muted" style="margin-top:10px">Las fuentes de cada proyecto están en su ficha (Proyectos → toca una fila). Este análisis es educativo y no reemplaza la asesoría de un profesional ni la cotización formal de bancos e inmobiliarias.</p></div>
  </div>`;
  $$('[data-sup]', el).forEach(i => i.addEventListener('change', () => { const v = +i.value; if (!isFinite(v)) return; S[i.dataset.sup] = v / (+i.dataset.scale); save(); render(); }));
  $$('[data-sec]', el).forEach(i => i.addEventListener('change', () => { const v = +i.value; if (!isFinite(v)) return; S.sect[i.dataset.sec] = Object.assign({}, S.sect[i.dataset.sec] || {}, {[i.dataset.k]: v}); save(); render(); }));
  $('#supReset', el).addEventListener('click', () => { const keep = {sueldo: S.sueldo, honor: S.honor, honorPct: S.honorPct, ahorro: S.ahorro, ahorroMes: S.ahorroMes, deudas: S.deudas, primeraViv: S.primeraViv}; S = Object.assign(JSON.parse(JSON.stringify(DEF)), keep); save(); render(); });
}

   8. ARRANQUE
   ===================================================================== */
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (['resumen', 'simulador', 'mapa'].includes(current)) render(); }, 180); });
const h0 = (location.hash || '').replace('#', '');
go(VIEWS[h0] ? h0 : 'resumen', false);
window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (VIEWS[h] && h !== current) go(h, false); });
window.RadarSur = {evaluar, ranking, planes, rentaComp, ALL_PROY, ALL_SECT, CIUDADES, BANCOS, setCity, S: () => S};
})();
</script>
