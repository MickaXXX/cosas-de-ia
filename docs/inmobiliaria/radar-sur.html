<title>Radar Inmobiliario Chile</title>
<meta name="description" content="Proyectos de departamentos en Antofagasta, Iquique, Santiago y Coquimbo: dividendo por banco, rentabilidad, seguridad, ranking, mapa de plusvalía y escenarios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra de navegación azul Pacífico a la izquierda + lienzo de tableros; cobre (la identidad minera de Antofagasta) marca lo que importa. */
:root{
  --bg:#f2f4f6; --surface:#fdfdfc; --surface-2:#eceff3; --ink:#0f1821; --ink-2:#465260; --muted:#6f7b88;
  --line:#dde2e8; --line-strong:#c3cad3;
  --accent:#ad501b; --accent-ink:#ffffff; --accent-soft:#f5e5d8; --accent-text:#9a4615;
  --nav-bg:#0e2134; --nav-ink:#f3f6f9; --nav-ink-2:#a9b8c8; --nav-hover:#16304a; --nav-active:#1d3b5a;
  --s1:#2a78d6; --s2:#c0612b; --deemph:#c3c9d0;
  --good:#0ca30c; --good-ink:#0b6b14; --warn:#fab219; --warn-ink:#8a5a00; --bad:#d03b3b; --bad-ink:#b02a2a;
  --div-neg:#e34948; --div-mid:#eef0f2; --div-pos:#2a78d6;
  --sea:#dfe9f2; --land:#f7f4ee; --hill:#ebe3d4; --north-veil:rgba(15,24,33,.05);
  --shadow:0 1px 2px rgba(15,24,33,.06),0 8px 24px rgba(15,24,33,.06);
  --f-display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1017; --surface:#111922; --surface-2:#18222d; --ink:#edf1f5; --ink-2:#b3bdc8; --muted:#8a96a3;
    --line:#22303d; --line-strong:#33414f;
    --accent:#e0884f; --accent-ink:#1a0f07; --accent-soft:#2b1d13; --accent-text:#eba273;
    --nav-bg:#08131f; --nav-ink:#eef3f8; --nav-ink-2:#8fa2b6; --nav-hover:#10233a; --nav-active:#173150;
    --s1:#3987e5; --s2:#d0703a; --deemph:#3a4654;
    --good-ink:#3cc45a; --warn-ink:#f2b84b; --bad-ink:#f07272;
    --div-neg:#e66767; --div-mid:#26303b; --div-pos:#3987e5;
    --sea:#0d1c2b; --land:#16202a; --hill:#1d2833; --north-veil:rgba(0,0,0,.28);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1017; --surface:#111922; --surface-2:#18222d; --ink:#edf1f5; --ink-2:#b3bdc8; --muted:#8a96a3;
  --line:#22303d; --line-strong:#33414f;
  --accent:#e0884f; --accent-ink:#1a0f07; --accent-soft:#2b1d13; --accent-text:#eba273;
  --nav-bg:#08131f; --nav-ink:#eef3f8; --nav-ink-2:#8fa2b6; --nav-hover:#10233a; --nav-active:#173150;
  --s1:#3987e5; --s2:#d0703a; --deemph:#3a4654;
  --good-ink:#3cc45a; --warn-ink:#f2b84b; --bad-ink:#f07272;
  --div-neg:#e66767; --div-mid:#26303b; --div-pos:#3987e5;
  --sea:#0d1c2b; --land:#16202a; --hill:#1d2833; --north-veil:rgba(0,0,0,.28);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-variation-settings:"wdth" 100}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.nav{background:var(--nav-bg);color:var(--nav-ink);position:sticky;top:0;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;overflow:auto;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font:800 17px/1.05 var(--f-display);font-variation-settings:"wdth" 122;letter-spacing:.005em}
.brand small{display:block;color:var(--nav-ink-2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:9px;color:var(--nav-ink-2);font-weight:500;font-size:14px;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--nav-hover);color:var(--nav-ink)}
.nav button[aria-current="page"]{background:var(--nav-active);color:var(--nav-ink)}
.nav button[aria-current="page"] svg{stroke:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);color:var(--nav-ink-2);font-size:12px;line-height:1.45}
.nav-foot b{color:var(--nav-ink);font-family:var(--f-mono);font-weight:500}
main{min-width:0;padding-block:22px 64px;padding-inline:32px}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.topbar h1{margin:0;font:800 clamp(24px,3vw,32px)/1.05 var(--f-display);font-variation-settings:"wdth" 118;letter-spacing:-.005em;text-wrap:balance}
.topbar .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.view{display:none;flex-direction:column;gap:20px}
.view.on{display:flex}

/* ---------- Bloques ---------- */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(280px,340px) minmax(0,1fr)}
.g-wide{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;min-width:0}
.panel>h2,.sec-title{margin:0 0 4px;font:700 16px/1.25 var(--f-display);font-variation-settings:"wdth" 110;letter-spacing:.005em;text-wrap:balance}
.panel>.sub,.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.panel-head h2{margin:0 0 2px;font:700 16px/1.25 var(--f-display);font-variation-settings:"wdth" 110}
.panel-head .sub{margin:0}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:12.5px}
p{margin:0 0 10px;max-width:72ch}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.hero-main{padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero-name{font:800 clamp(22px,2.6vw,30px)/1.08 var(--f-display);font-variation-settings:"wdth" 116;margin:0;text-wrap:balance}
.hero-meta{color:var(--ink-2);font-size:13.5px}
.hero-figure{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin-top:4px}
.hero-figure .big{font:700 52px/1 var(--f-ui);letter-spacing:-.02em}
.hero-figure .big small{font-size:20px;font-weight:600;color:var(--ink-2);margin-left:2px}
.hero-side{background:var(--surface-2);padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;align-content:start;border-left:1px solid var(--line)}
.kv .k{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.kv .v{font:600 18px/1.25 var(--f-ui);margin-top:2px}
.kv .v small{font-size:12px;font-weight:500;color:var(--ink-2);display:block}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:650 22px/1.2 var(--f-ui);margin-top:4px;font-variation-settings:"wdth" 104}
.kpi .d{font-size:12px;color:var(--ink-2);margin-top:2px}

/* Pills de estado */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.pill i{font-style:normal;font-size:10px;line-height:1}
.pill.good{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 35%,transparent);background:color-mix(in srgb,var(--good) 9%,transparent)}
.pill.warn{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.bad{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.pill.acc{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.pos{color:var(--good-ink)} .neg{color:var(--bad-ink)}

/* Formularios */
.form{display:grid;gap:14px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.field>label output,.field>.lbl output{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.field .hint{font-size:11.5px;color:var(--muted)}
input[type=number],input[type=text],select{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=number]{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.toggle{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:2px 0 0;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.filters .field{min-width:150px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:hover{filter:brightness(1.06)}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.tbl tbody tr.sel td{background:var(--accent-soft)}
.tbl .pname{font-weight:650;color:var(--ink)}
.tbl .pinmo{font-size:12px;color:var(--muted)}
.tbl tr.best td{background:color-mix(in srgb,var(--s1) 8%,transparent)}
.tbl td.dim{color:var(--muted)}

/* Barras HTML (ranking, bancos) */
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;border-radius:6px;padding:2px 0}
.bar-row .bl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bl b{font-weight:650}
.bar-row .bl span{color:var(--muted);font-size:12px}
.bar-track{height:18px;position:relative}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--deemph);min-width:2px}
.bar-fill.em{background:var(--s2)}
.bar-fill.s1{background:var(--s1)}
.bar-row .bv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink);text-align:right;min-width:64px}
.bar-row:hover .bar-fill{filter:brightness(1.08)}

/* Gráficos SVG */
.chart{width:100%;position:relative;min-height:120px}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis-l{stroke:var(--line-strong);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.legend i.line{width:16px;height:2px;border-radius:2px}
.legend i.sq{border-radius:2px}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:9px;box-shadow:var(--shadow);padding:9px 11px;font-size:12.5px;max-width:280px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip .tv{font:600 14px var(--f-ui)}
#tip .tl{color:var(--muted);font-size:12px}
#tip .tr{display:flex;align-items:center;gap:7px;margin-top:3px}
#tip .tr i{display:inline-block;width:12px;height:2px;border-radius:2px}

/* Mapa */
.map-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.map-wrap>svg,.map-wrap>canvas{position:absolute;inset:0;width:100%;height:100%}
.map-wrap canvas{mix-blend-mode:normal;opacity:.82;pointer-events:none}
.map-legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap}
.ramp{height:10px;width:180px;border-radius:5px}
.map-label{font:600 11px var(--f-ui);fill:var(--ink-2);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.map-label.big{font-size:12.5px;fill:var(--ink)}
.map-mk{cursor:pointer}
.map-mk:focus{outline:none}
.map-mk:focus circle.ring{stroke:var(--accent);stroke-width:3}

/* Heat grid */
.hgrid{border-collapse:separate;border-spacing:2px;font-size:12px;width:100%}
.hgrid th{font-weight:600;color:var(--muted);font-family:var(--f-mono);font-size:11.5px;padding:4px 6px;text-align:center}
.hgrid td{text-align:center;padding:9px 4px;border-radius:4px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;cursor:default}
.hgrid td.cur{outline:2px solid var(--ink);outline-offset:-2px}

/* Tornado */
.tornado{display:grid;gap:7px}
.tor-row{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.tor-track{position:relative;height:18px}
.tor-track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-strong)}
.tor-bar{position:absolute;top:0;bottom:0}
.tor-bar.lo{background:var(--div-neg);border-radius:4px 0 0 4px}
.tor-bar.hi{background:var(--div-pos);border-radius:0 4px 4px 0}
.tor-row .tv{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

.banner{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:14px 18px}
.banner p{margin:4px 0 0;max-width:90ch;color:var(--ink)}
.ruta{display:grid;gap:9px}
.ruta-row{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) minmax(92px,auto);gap:12px;align-items:center;font-size:13px}
.ruta-row .rl{min-width:0}
.ruta-row .rl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruta-row .rl span{font-size:11.5px;color:var(--muted)}
.ruta-track{position:relative;height:16px;background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:4px}
.ruta-seg{position:absolute;top:0;bottom:0}
.ruta-seg.wait{background:var(--deemph)}
.ruta-seg.obra{background:var(--s2)}
.ruta-seg.first{border-radius:4px 0 0 4px}
.ruta-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 2px var(--surface)}
.ruta-row .rv{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap}
.ruta-axis{position:relative;height:16px;font:11px var(--f-mono);color:var(--muted)}
.ruta-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ruta-head{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) minmax(92px,auto);gap:12px}
@media (max-width:900px){.ruta-row,.ruta-head{grid-template-columns:minmax(100px,130px) minmax(0,1fr) auto}}
.citybar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.citybar .seg button{font-size:13px;padding:7px 13px}
/* Detalle de proyecto */
.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:3px 0}
.src{font-size:12px;word-break:break-all}

/* Memo de asesoría */
.memo{max-width:80ch}
.memo h3{font:700 15px/1.3 var(--f-display);font-variation-settings:"wdth" 108;margin:18px 0 6px}
.memo h3:first-child{margin-top:0}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick .tag{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-text);grid-column:1/-1}
.pick .pn{font-weight:700;font-size:15px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font:700 12px var(--f-mono)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .fv{font:650 20px/1.2 var(--f-ui)}
.fact .fd{font-size:12.5px;color:var(--ink-2)}
.fact a{font-size:11.5px}

function rentaEstimada(p, u){

    const b = BANCOS.find(x => x.id === c.banco) || BANCOS[0];

  let best = null;
  BANCOS.forEach(b => { const t = tasaDe(b); if (!best || t < best.tasa) best = {b, tasa:t, eleg}; });

  const f = Object.assign({zona: S.zona, tip: S.tip}, filtro || {});
  const out = [];
  (f.city === 'all' ? ALL_PROY : PROYECTOS).forEach(p => {
    const s = sect(p.sector);
    if (f.zona === 'sur' && !s.sur) return;
    if (f.zona === 'norte' && s.sur) return;
    p.u.forEach((u, k) => {
      if (f.tip === '1D' && u.d !== 1) return;
      if (f.tip === '2D' && u.d !== 2) return;
      out.push({p, u, key: p.id + ':' + k});
    });
  });
  return out;
}
function unitByKey(key){ const [id, k] = String(key).split(':'); const p = projById(id); return p ? {p, u: p.u[+k] || p.u[0], key} : null; }
const riesgoBase = (p) => clamp(100 - (p.meses || 0) / 36 * 45 - ({alta:0, media:15, baja:35})[p.conf] - (p.estado === 'inmediata' ? 0 : 8), 0, 100);

/* Caminos de compra con tu renta y tu ahorro. Para cada unidad calcula cuándo podrías firmar
   y recibir las llaves: (1) ahorrando el pie normal, (2) primera vivienda con FOGAES (pie 10%
   y subsidio a la tasa) y (3) completando el pie con un crédito de consumo. En venta en verde o
   en blanco el pie se paga en cuotas hasta la entrega, así que tu ahorro mensual también cuenta. */
const planCache = new Map(); let planSig = '';
function planes(p, u){
  const sig = JSON.stringify([S.sueldo, S.honor, S.honorPct, S.ahorro, S.ahorroMes, S.deudas, S.primeraViv, S.cargaMax, S.consTasa, S.consPlazo, S.divRenta, S.banco, S.plazo, S.pie, S.uf, S.sect, S.bancosOv, S.vac, S.mant, S.corr, S.horizonte, S.desg, S.inc, S.gastosFijos, S.cbr, S.ite, S.comprarExtras, S.miCiudad, S.adminRemota]);
  if (sig !== planSig){ planCache.clear(); planSig = sig; }
  const key = p.id + ':' + p.u.indexOf(u);
  if (planCache.has(key)) return planCache.get(key);
  const R = rentaComp(), m = Math.max(0, S.ahorroMes), A0 = Math.max(0, S.ahorro), D = p.meses || 0;
  const base = evaluar(p, u);
  const eligFog = !!S.primeraViv && base.P <= 6000;
  const enConsumo = o => o.loan > 0 && S.consPlazo > D;
  const check = o => {
    o.cuotaCons = o.r.consCuota * S.uf;
    o.divRatio = o.r.div1 * S.uf / R;
    o.carga = (o.r.div1 * S.uf + S.deudas + (enConsumo(o) ? o.cuotaCons : 0)) / R;
    o.holgura = m + o.r.flujo1 * S.uf - (enConsumo(o) ? o.cuotaCons : 0);
    o.okDiv = o.divRatio <= S.divRenta + 1e-9;
    o.okCarga = o.carga <= S.cargaMax + 1e-9;
    o.okHolgura = o.holgura >= 0;
    o.llaves = o.w + D;
    o.viable = o.okDiv && o.okCarga && o.okHolgura && isFinite(o.w);
    return o;
  };
  const ahorrar = (id, n, ov) => {
    const r = evaluar(p, u, Object.assign({pieCuotas: true}, ov));
    const need = (r.piePago + r.gastos) * S.uf, falta = need - A0 - m * D;
    const w = falta <= 0 ? 0 : (m > 0 ? Math.ceil(falta / m) : Infinity);
    return check({id, n, r, need, w, loan: 0, pie: ov.pie, sub: !!ov.subsidio});
  };
  const lst = [ahorrar('ahorro', 'Ahorrar el pie de ' + NF0.format(S.pie * 100) + '%', {pie: S.pie, subsidio: false})];
  if (eligFog) lst.push(ahorrar('fogaes', 'Primera vivienda: pie 10% con FOGAES', {pie: 0.10, subsidio: true}));
  const pieC = eligFog ? Math.min(0.10, S.pie) : S.pie;
  const r0 = evaluar(p, u, {pie: pieC, subsidio: eligFog, pieCuotas: true});
  const need = (r0.piePago + r0.gastos) * S.uf, gap = need - A0 - m * D;
  if (gap > 0){
    const rc = S.consTasa, nC = S.consPlazo;
    const a = rc > 0 ? rc / (1 - Math.pow(1 + rc, -nC)) : 1 / nC;
    const den = 1 - a * Math.min(D, nC);   // en verde, las cuotas del consumo corren durante la obra
    if (den > 0.05){
      const loan = gap / den;
      const r = evaluar(p, u, {pie: pieC, subsidio: eligFog, pieCuotas: true, consumo: {monto: loan, tasaM: rc, n: nC}});
      lst.push(check({id: 'consumo', n: 'Crédito de consumo para completar el pie', r, need, w: 0, loan, pie: pieC, sub: eligFog}));
    }
  }
  const costo = o => o.llaves + (o.id === 'consumo' ? 12 : 0);   // la deuda de consumo debe adelantar más de un año para preferirse
  const viables = lst.filter(o => o.viable);
  const best = viables.slice().sort((x, y) => costo(x) - costo(y) || ((y.r.tir || 0) - (x.r.tir || 0)))[0] || null;
  const sinDeuda = viables.filter(o => o.id !== 'consumo').sort((x, y) => x.llaves - y.llaves)[0] || null;
  const res = {lst, best, sinDeuda, consumo: lst.find(o => o.id === 'consumo') || null, eligFog, rentaFalta: !lst.some(o => o.okDiv)};
  planCache.set(key, res);
  return res;
}
function estadoPlan(pl){
  if (pl.best){
    const b = pl.best;
    if (b.w === 0) return b.id === 'consumo' ? {t: 'Hoy, con consumo', cls: 'warn', ic: '!'} : {t: 'Puedes firmar hoy', cls: 'good', ic: '✓'};
    return {t: 'Firmas en ' + mesesTxt(b.w), cls: b.w <= 12 ? 'good' : b.w <= 36 ? 'warn' : 'bad', ic: b.w <= 12 ? '◷' : '…'};
  }
  if (pl.rentaFalta) return {t: 'Tu renta no alcanza', cls: 'bad', ic: '✕'};
  return {t: 'No sostenible', cls: 'bad', ic: '✕'};
}
const planPill = pl => { const e = estadoPlan(pl); return `<span class="pill ${e.cls}"><i>${e.ic}</i>${esc(e.t)}</span>`; };
const caminoCorto = o => !o ? '—' : o.id === 'consumo' ? 'Consumo ' + clpM(o.loan) + (o.sub ? ' + FOGAES' : '') : o.id === 'fogaes' ? 'FOGAES pie 10%' : 'Ahorro pie ' + NF0.format(o.pie * 100) + '%';

/* Ranking ponderado. Cada componente se normaliza 0–100 dentro del conjunto evaluado. */
function ranking(filtro){
  const list = unidades(filtro).map(x => Object.assign(x, {r: evaluar(x.p, x.u), plan: planes(x.p, x.u)}));
  if (!list.length) return [];
  const comp = {
    tir: x => isFinite(x.r.tir) ? x.r.tir : -0.2,
    flujo: x => x.r.flujo1,
    cap: x => x.r.capRate,
    plus: x => sect(x.p.sector).plus,
    acceso: x => x.plan.best ? -(x.plan.best.llaves + (x.plan.best.id === 'consumo' ? 12 : 0)) : -150,
    riesgo: x => riesgoBase(x.p),
    seguridad: x => sect(x.p.sector).seg,
    entorno: x => (sect(x.p.sector).con + sect(x.p.sector).dem) / 2
  };
  const norm = {};
  Object.keys(comp).forEach(k => {
    const vals = list.map(comp[k]);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    norm[k] = v => mx - mn < 1e-12 ? 50 : (v - mn) / (mx - mn) * 100;
  });
  const W = S.w, wsum = Object.values(W).reduce((a, b) => a + b, 0) || 1;
  list.forEach(x => {
    x.c = {};
    let sc = 0;
    Object.keys(comp).forEach(k => { x.c[k] = norm[k](comp[k](x)); sc += x.c[k] * (W[k] || 0); });
    x.score = sc / wsum;
  });
  list.sort((a, b) => b.score - a.score);
  list.forEach((x, i) => x.rank = i + 1);
  return list;
}
const COMP_TXT = {tir:'TIR', flujo:'flujo mensual', cap:'cap rate', plus:'plusvalía del sector', acceso:'tiempo para poder comprar con tu renta y ahorro', riesgo:'riesgo de entrega y dato', seguridad:'seguridad del sector', entorno:'conectividad y demanda de arriendo'};
function porQue(x){
  const ks = Object.keys(x.c).filter(k => (S.w[k]||0) > 0).sort((a, b) => x.c[b] - x.c[a]);
  const fuertes = ks.slice(0, 2).map(k => COMP_TXT[k]);
  const debil = ks[ks.length - 1];
  return 'Destaca en ' + fuertes.join(' y ') + '. Más débil en ' + COMP_TXT[debil] + '.' + (x.p.conf === 'baja' ? ' Dato parcial: confirma precio y m² antes de decidir.' : '');
}

const tip = $('#tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y + 14;
  if (left + w > window.innerWidth - 8) left = x - w - 14;
  if (top + h > window.innerHeight - 8) top = y - h - 14;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
function hideTip(){ tip.classList.remove('on'); }
function niceTicks(min, max, count){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const err = step0 / mag; const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Barras horizontales HTML (una serie; énfasis en el elemento destacado) */
function barsHTML(rows, fmt, opts){
  opts = opts || {};
  const max = Math.max(...rows.map(r => Math.abs(r.v)), 1e-9);
  return '<div class="bars">' + rows.map((r, i) => {
    const w = Math.max(0, r.v) / max * 100;
    return `<div class="bar-row" tabindex="0" data-tip="${esc(r.tip || '')}"><div class="bl"><b>${esc(r.l)}</b>${r.s ? ' <span>' + esc(r.s) + '</span>' : ''}</div><div class="bar-track"><div class="bar-fill ${r.em ? (opts.emClass || 'em') : ''}" style="width:${w.toFixed(2)}%"></div></div><div class="bv">${esc(fmt(r.v))}</div></div>`;
  }).join('') + '</div>';
}
function bindBarTips(root){
  $$('.bar-row[data-tip], .ruta-row[data-tip]', root).forEach(el => {
    const t = el.getAttribute('data-tip'); if (!t) return;
    el.addEventListener('pointermove', e => showTip(t, e.clientX, e.clientY));
    el.addEventListener('pointerleave', hideTip);
    el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); showTip(t, r.left + 40, r.bottom); });
    el.addEventListener('blur', hideTip);
  });
}

/* Dispersión: x, y con grupo principal (zona sur, cobre) y contexto (gris). */
function scatter(el, pts, o){
  const W = Math.max(280, el.clientWidth), Hh = o.h || 300;
  const m = {l: 64, r: 14, t: 12, b: 40};
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const xt = niceTicks(Math.min(...xs), Math.max(...xs), 5), yt = niceTicks(Math.min(0, ...ys), Math.max(0, ...ys), 5);
  const x0 = xt[0], x1 = xt[xt.length - 1], y0 = yt[0], y1 = yt[yt.length - 1];
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => Hh - m.b - (v - y0) / (y1 - y0) * (Hh - m.t - m.b);
  let s = `<svg width="${W}" height="${Hh}" role="img" aria-label="${esc(o.aria || '')}">`;
  yt.forEach(v => { s += `<line class="${v === 0 ? 'axis-l' : 'grid-l'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(o.yFmt(v))}</text>`; });
  xt.forEach(v => { s += `<text x="${X(v)}" y="${Hh - m.b + 18}" text-anchor="middle">${esc(o.xFmt(v))}</text>`; });
  s += `<text x="${(m.l + W - m.r) / 2}" y="${Hh - 4}" text-anchor="middle">${esc(o.xLabel)}</text>`;
  const order = pts.slice().sort((a, b) => (a.main ? 1 : 0) - (b.main ? 1 : 0));
  order.forEach(p => {
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.big ? 7 : 5}" fill="${p.main ? 'var(--s2)' : 'var(--deemph)'}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  pts.filter(p => p.label).forEach(p => {
    const lx = X(p.x), anchor = lx > W * 0.7 ? 'end' : 'start';
    s += `<text x="${lx + (anchor === 'end' ? -10 : 10)}" y="${Y(p.y) - 8}" text-anchor="${anchor}" style="fill:var(--ink-2);font-family:var(--f-ui);font-weight:600">${esc(p.label)}</text>`;
  });
  s += '</svg>';
  el.innerHTML = s;
  const svg = el.querySelector('svg');
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 24 * 24;
    pts.forEach(p => { const dx = X(p.x) - mx, dy = Y(p.y) - my, d = dx * dx + dy * dy; if (d < bd){ bd = d; best = p; } });
    if (best) showTip(best.tip, e.clientX, e.clientY); else hideTip();
  });
  svg.addEventListener('pointerleave', hideTip);
}

/* Líneas con cruz que se ajusta al año más cercano */
function lines(el, series, o){
  const W = Math.max(280, el.clientWidth), Hh = o.h || 260;
  const m = {l: 64, r: 92, t: 14, b: 34};
  const all = series.flatMap(s => s.v);
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const yt = niceTicks(Math.min(0, ...ys), Math.max(...ys), 5);
  const y0 = yt[0], y1 = yt[yt.length - 1];
  const X = v => m.l + (v - xmin) / Math.max(1e-9, xmax - xmin) * (W - m.l - m.r);
  const Y = v => Hh - m.b - (v - y0) / (y1 - y0) * (Hh - m.t - m.b);
  let s = `<svg width="${W}" height="${Hh}" role="img" aria-label="${esc(o.aria || '')}">`;
  yt.forEach(v => { s += `<line class="${v === 0 ? 'axis-l' : 'grid-l'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(o.yFmt(v))}</text>`; });
  const xsU = [...new Set(xs)].sort((a, b) => a - b);
  const stepLbl = Math.ceil(xsU.length / 8);
  xsU.forEach((v, k) => { if (k % stepLbl === 0 || k === xsU.length - 1) s += `<text x="${X(v)}" y="${Hh - m.b + 18}" text-anchor="middle">${esc(o.xFmt(v))}</text>`; });
  series.forEach(se => {
    if (se.area){
      const d = se.v.map((p, k) => (k ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ') + ` L${X(se.v[se.v.length - 1].x).toFixed(1)} ${Y(0)} L${X(se.v[0].x).toFixed(1)} ${Y(0)} Z`;
      s += `<path d="${d}" fill="${se.c}" opacity=".10"/>`;
    }
    const d = se.v.map((p, k) => (k ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = se.v[se.v.length - 1];
    s += `<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="4" fill="${se.c}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  // etiquetas finales con separación mínima
  const ends = series.map(se => ({n: se.n, y: Y(se.v[se.v.length - 1].y), v: se.v[se.v.length - 1].y})).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 26) ends[k].y = ends[k - 1].y + 26;
  ends.forEach(e => { s += `<text x="${W - m.r + 8}" y="${e.y - 2}" style="fill:var(--ink-2);font-family:var(--f-ui);font-weight:600">${esc(e.n)}</text><text x="${W - m.r + 8}" y="${e.y + 11}">${esc(o.yFmt(e.v))}</text>`; });
  s += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${Hh - m.b}" stroke="var(--line-strong)" stroke-width="1" opacity="0"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh');
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), mx = e.clientX - r.left;
    let bx = xsU[0], bd = Infinity; xsU.forEach(v => { const d = Math.abs(X(v) - mx); if (d < bd){ bd = d; bx = v; } });
    xh.setAttribute('x1', X(bx)); xh.setAttribute('x2', X(bx)); xh.setAttribute('opacity', 1);
    let h = `<div class="tl">${esc(o.xFmt(bx, true))}</div>`;
    series.forEach(se => { const p = se.v.find(q => q.x === bx); if (p) h += `<div class="tr"><i style="background:${se.c}"></i><span class="tv">${esc(o.yFmt(p.y, true))}</span> <span class="tl">${esc(se.n)}</span></div>`; });
    showTip(h, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => { xh.setAttribute('opacity', 0); hideTip(); });
}

/* Interpolación de colores para cuadrículas divergentes */
function hex2rgb(h){ h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(k => parseInt(h.substr(k, 2), 16)); }
function mix(a, b, t){ const A = hex2rgb(a), B = hex2rgb(b); return A.map((v, k) => Math.round(v + (B[k] - v) * t)); }
function divColor(v, center, span){
  const neg = cssVar('--div-neg') || '#e34948', mid = cssVar('--div-mid') || '#eef0f2', pos = cssVar('--div-pos') || '#2a78d6';
  const t = clamp((v - center) / span, -1, 1);
  const rgb = t >= 0 ? mix(mid, pos, t) : mix(mid, neg, -t);
  const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  return {bg: `rgb(${rgb.join(',')})`, fg: lum > 0.55 ? '#0f1821' : '#ffffff'};
}

/* Controles compartidos */
function segHTML(id, opts, val){
  return `<div class="seg" role="group" data-seg="${id}">` + opts.map(o => `<button type="button" data-val="${esc(o[0])}" aria-pressed="${String(o[0]) === String(val)}">${esc(o[1])}</button>`).join('') + '</div>';
}
function bindSegs(root, handler){
  $$('[data-seg]', root).forEach(g => $$('button', g).forEach(b => b.addEventListener('click', () => handler(g.dataset.seg, b.dataset.val))));
}
function bancoOptions(sel, mejor){
  return (mejor ? `<option value="mejor"${sel === 'mejor' ? ' selected' : ''}>Mejor tasa disponible</option>` : '') + BANCOS.map(b => `<option value="${b.id}"${sel === b.id ? ' selected' : ''}>${esc(b.n)} · ${NF2.format(bancoTasa(b))}%</option>`).join('');
}
function unitLabel(p, u){ return p.n + ' · ' + u.t + ' ' + NF1.format(u.m2) + ' m²'; }
function estadoPill(p){
  const cls = p.estado === 'inmediata' ? 'good' : 'warn';
  const ic = p.estado === 'inmediata' ? '●' : '◐';
  return `<span class="pill ${cls}"><i>${ic}</i>${esc(ESTADO_TXT[p.estado])}</span>`;
}
function confPill(p){
  const cls = {alta:'good', media:'warn', baja:'bad'}[p.conf], ic = {alta:'✓', media:'!', baja:'?'}[p.conf];
  return `<span class="pill ${cls}" title="Confianza del dato"><i>${ic}</i>${esc(CONF_TXT[p.conf])}</span>`;
}
function extraTxt(x){
  if (!x) return '<span class="muted">s/i</span>';
  if (x.incl === true) return 'Incluido' + (x.nota ? ' <span class="muted">(' + esc(x.nota) + ')</span>' : '');
  if (x.incl === false) return 'Aparte' + (x.uf ? ' · ' + ufF(x.uf, 0) : '');
  return '<span class="muted">Consultar' + (x.nota ? ' · ' + esc(x.nota) : '') + '</span>';
}
function flujoCell(v){ return `<span class="${v >= 0 ? 'pos' : 'neg'}">${clpS(v)}</span>`; }
function perfilHTML(){
  return `<div class="panel"><div class="panel-head"><div><h2>Tu perfil de inversión</h2><p class="sub">Tus datos actuales. Más detalle (deudas, primera vivienda, crédito de consumo) en Mi situación.</p></div></div>
  <div class="frow">
    <div class="field"><label for="pfSueldo">Sueldo líquido mensual</label><input id="pfSueldo" type="number" step="50000" min="0" value="${S.sueldo}"></div>
    <div class="field"><label for="pfHonor">Boletas de honorarios (bruto/mes)</label><input id="pfHonor" type="number" step="10000" min="0" value="${S.honor}"></div>
    <div class="field"><label for="pfAhorro">Ahorro actual</label><input id="pfAhorro" type="number" step="100000" min="0" value="${S.ahorro}"></div>
    <div class="field"><label for="pfAhorroMes">Ahorro mensual</label><input id="pfAhorroMes" type="number" step="10000" min="0" value="${S.ahorroMes}"></div>
  </div>
  <div class="frow" style="margin-top:12px">
    <div class="field"><label for="pfPie">Pie <output>${NF0.format(S.pie * 100)}%</output></label><input id="pfPie" type="range" min="0.1" max="0.4" step="0.01" value="${S.pie}"></div>
    <div class="field"><label for="pfPlazo">Plazo <output>${S.plazo} años</output></label><input id="pfPlazo" type="range" min="15" max="30" step="5" value="${S.plazo}"></div>
    <div class="field"><label for="pfBanco">Banco</label><select id="pfBanco">${bancoOptions(S.banco, true)}</select></div>
  </div>
  <div class="filters" style="margin-top:12px">
    <div class="field"><span class="lbl">Zona</span>${segHTML('zona', [['sur', C().pref],['todas','Toda la ciudad'],['norte', C().otra]], S.zona)}</div>
    <div class="field"><span class="lbl">Tipología</span>${segHTML('tip', [['todas','1D y 2D'],['1D','1 dormitorio'],['2D','2 dormitorios']], S.tip)}</div>
    <label class="toggle" style="align-self:center"><input id="pfSub" type="checkbox"${S.subsidio ? ' checked' : ''}><span>Aplicar subsidio a la tasa / FOGAES<br><span class="muted small">Sólo si será tu primera vivienda (nueva, ≤ 6.000 UF)</span></span></label>
  </div></div>`;
}
function bindPerfil(root){
  const n = (id, k) => { const el = $('#' + id, root); if (el) el.addEventListener('change', () => set(k, Math.max(0, +el.value || 0))); };
  n('pfSueldo', 'sueldo'); n('pfHonor', 'honor'); n('pfAhorro', 'ahorro'); n('pfAhorroMes', 'ahorroMes');
  const r = (id, k) => { const el = $('#' + id, root); if (!el) return; el.addEventListener('input', () => { el.previousElementSibling.querySelector('output').textContent = k === 'pie' ? NF0.format(el.value * 100) + '%' : el.value + ' años'; }); el.addEventListener('change', () => set(k, +el.value)); };
  r('pfPie', 'pie'); r('pfPlazo', 'plazo');
  const b = $('#pfBanco', root); if (b) b.addEventListener('change', () => set('banco', b.value));
  const sub = $('#pfSub', root); if (sub) sub.addEventListener('change', () => set('subsidio', sub.checked));
  bindSegs(root, (k, v) => set(k, v));
}

/* =====================================================================
   7. VISTAS
   ===================================================================== */
function rResumen(el){
  const rk = ranking();
  const todos = ranking({zona:'todas', tip:'todas'});
  const sur = PROYECTOS.filter(p => sect(p.sector).sur);
  if (!rk.length){ el.innerHTML = perfilHTML() + '<div class="panel">No hay unidades con estos filtros.</div>'; bindPerfil(el); return; }
  const top = rk[0], r = top.r;
  const surU = todos.filter(x => sect(x.p.sector).sur);
  const avg = (arr, f) => arr.reduce((a, x) => a + f(x), 0) / Math.max(1, arr.length);
  const best = BANCOS.reduce((a, b) => bancoTasa(b) < bancoTasa(a) ? b : a);
  const R = rentaComp();
  const cerca = rk.filter(x => x.plan.sinDeuda).sort((a, b) => a.plan.sinDeuda.w - b.plan.sinDeuda.w || a.plan.sinDeuda.llaves - b.plan.sinDeuda.llaves)[0];
  const hoySin = rk.filter(x => x.plan.sinDeuda && x.plan.sinDeuda.w === 0).length;
  const hoyCon = rk.filter(x => !(x.plan.sinDeuda && x.plan.sinDeuda.w === 0) && x.plan.consumo && x.plan.consumo.viable).length;
  el.innerHTML = `
  <div class="banner"><div><div class="label">Tu situación hoy</div>
    <p>El banco ve una renta de <b>${clp(R)}</b> y te aprueba un dividendo de hasta <b>${clp(R * S.divRenta)}</b>. Tienes ${clpM(S.ahorro)} y ahorras ${clpM(S.ahorroMes)} al mes.
    ${cerca ? `Lo más cercano sin crédito de consumo: <b>${esc(cerca.p.n)} ${esc(cerca.u.t)}</b>. ${cerca.plan.sinDeuda.w === 0 ? 'Puedes firmar hoy' : 'Firmas en ' + fechaEn(cerca.plan.sinDeuda.w)} y recibes las llaves en ${fechaEn(cerca.plan.sinDeuda.llaves)} (${esc(caminoCorto(cerca.plan.sinDeuda))}).` : 'Hoy ninguna unidad es viable sin crédito de consumo.'}</p></div>
    <button class="btn" type="button" data-go="situacion">Ver mi situación</button></div>
  <div class="hero">
    <div class="hero-main">
      <div class="label">Hoy te conviene · #1 de ${rk.length} unidades evaluadas</div>
      <h2 class="hero-name">${esc(top.p.n)} <span class="muted" style="font-weight:600">${esc(top.u.t)}</span></h2>
      <div class="hero-meta">${esc(top.p.inmo)} · ${esc(top.p.dir)} · ${esc(sect(top.p.sector).n)} · ${NF1.format(top.u.m2)} m² · ${ufF(top.u.uf, 0)}</div>
      <div class="hero-figure">
        <div><div class="label">TIR estimada a ${S.horizonte} años</div><div class="big">${isFinite(r.tir) ? NF1.format(r.tir * 100) : '—'}<small>% real</small></div></div>
        <div><div class="label">Puntaje</div><div class="big" style="font-size:36px">${NF0.format(top.score)}<small>/100</small></div></div>
      </div>
      <div class="chips">${estadoPill(top.p)} ${confPill(top.p)} ${planPill(top.plan)}</div>
      <p class="small ink2" style="margin:0">${esc(porQue(top))}</p>
      <div><button class="btn" data-sim="${top.key}">Simular esta unidad</button></div>
    </div>
    <div class="hero-side">
      <div class="kv"><div class="k">Pie a pagar</div><div class="v">${ufF(r.piePago, 0)}<small>${clp(r.piePago * S.uf)}</small></div></div>
      <div class="kv"><div class="k">Inversión inicial</div><div class="v">${clpM(r.invIni * S.uf)}<small>pie + gastos operacionales</small></div></div>
      <div class="kv"><div class="k">Dividendo</div><div class="v">${clp(r.div1 * S.uf)}<small>${ufF(r.div1, 2)} · ${esc(r.banco.n)} ${NF2.format(r.tasa)}%</small></div></div>
      <div class="kv"><div class="k">Arriendo estimado</div><div class="v">${clp(r.rent)}<small>+ GC ≈ ${clp(r.gcCLP)} que paga el arrendatario</small></div></div>
      <div class="kv"><div class="k">Flujo mensual</div><div class="v ${r.flujo1 >= 0 ? 'pos' : 'neg'}">${clpS(r.flujo1 * S.uf)}<small>después de dividendo y costos</small></div></div>
      <div class="kv"><div class="k">Renta exigida</div><div class="v">${clp(r.sueldoReq)}<small>dividendo ≤ 25% de la renta</small></div></div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="k">Proyectos mapeados</div><div class="v">${PROYECTOS.length}</div><div class="d">${sur.length} ${esc(C().prefEn)}</div></div>
    <div class="kpi"><div class="k">Precio medio ${esc(C().prefCorto)}</div><div class="v">${NF1.format(avg(surU, x => x.u.uf / x.u.m2))} UF/m²</div><div class="d">${surU.length} unidades 1D y 2D</div></div>
    <div class="kpi"><div class="k">Cap rate medio ${esc(C().prefCorto)}</div><div class="v">${pct(avg(surU, x => x.r.capRate))}</div><div class="d">${esc(C().capRef)}</div></div>
    <div class="kpi"><div class="k">Mejor tasa hipotecaria</div><div class="v">${NF2.format(bancoTasa(best))}%</div><div class="d">${esc(best.n)} · promedio 4,06%</div></div>
    <div class="kpi"><div class="k">Con flujo positivo</div><div class="v">${rk.filter(x => x.r.flujo1 >= 0).length} de ${rk.length}</div><div class="d">con pie ${NF0.format(S.pie * 100)}% a ${S.plazo} años</div></div>
    <div class="kpi"><div class="k">Puedes firmar hoy</div><div class="v">${hoySin} de ${rk.length}</div><div class="d">sin deuda de consumo · ${hoyCon} más con consumo</div></div>
  </div>

  ${perfilHTML()}

  <div class="grid g2">
    <div class="panel"><h2>Top 8 del ranking</h2><p class="sub">Puntaje 0–100 con tus ponderaciones actuales. Cambia los pesos en Ranking.</p><div id="rsTop"></div></div>
    <div class="panel"><h2>Flujo mensual frente a la inversión inicial</h2><p class="sub">Cada punto es una unidad. Arriba a la izquierda: menos capital y mejor flujo.</p>
      <div class="legend"><span><i style="background:var(--s2)"></i>${esc(C().pref)}</span><span><i style="background:var(--deemph)"></i>${esc(C().otra)} (referencia)</span></div>
      <div class="chart" id="rsScatter"></div></div>
  </div>

  <div class="panel"><h2>Pulso del mercado</h2><p class="sub">Datos públicos de prensa y portales a ${esc(FECHA_DATOS)}.</p>
    <div class="grid g3">${MERCADO.map(m => `<div class="fact"><div class="fv">${esc(m.v)}</div><div><b>${esc(m.t)}</b></div><div class="fd">${esc(m.d)}</div><a href="${esc(m.f)}" target="_blank" rel="noopener">Fuente</a></div>`).join('')}</div>
  </div>`;
  bindPerfil(el);
  $$('[data-go]', el).forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $$('[data-sim]', el).forEach(b => b.addEventListener('click', () => { S.sim = b.dataset.sim; S.simOv = {}; save(); go('simulador'); }));
  $('#rsTop', el).innerHTML = barsHTML(rk.slice(0, 8).map((x, i) => ({l: '#' + x.rank + ' ' + x.p.n, s: x.u.t, v: x.score, em: i === 0,
    tip: `<div class="tv">${NF0.format(x.score)} puntos</div><div class="tl">${esc(unitLabel(x.p, x.u))}</div><div class="tl">TIR ${pct(x.r.tir)} · flujo ${clpS(x.r.flujo1 * S.uf)}</div>`})), v => NF0.format(v));
  bindBarTips($('#rsTop', el));
  const pts = todos.map(x => ({x: x.r.invIni * S.uf / 1e6, y: x.r.flujo1 * S.uf / 1e3, main: sect(x.p.sector).sur, big: x.key === top.key,
    label: x.key === top.key ? '#1 ' + x.p.n : '',
    tip: `<div class="tv">${clpS(x.r.flujo1 * S.uf)} / mes</div><div class="tl">${esc(unitLabel(x.p, x.u))}</div><div class="tl">Inversión inicial ${clpM(x.r.invIni * S.uf)} · ${esc(sect(x.p.sector).n)}</div>`}));
  scatter($('#rsScatter', el), pts, {xFmt: v => '$' + NF0.format(v) + ' M', yFmt: v => (v > 0 ? '+' : sgn(v)) + '$' + NF0.format(Math.abs(v)) + ' mil', xLabel: 'Inversión inicial (millones de pesos)', aria: 'Flujo mensual versus inversión inicial'});
}

function rProyectos(el){
  const zonaOk = p => S.provZona === 'todas' || (S.provZona === 'sur') === sect(p.sector).sur;
  const q = S.provQ.trim().toLowerCase();
  const rows = [];
  PROYECTOS.forEach(p => {
    if (!zonaOk(p)) return;
    if (S.provEstado !== 'todos' && p.estado !== S.provEstado) return;
    if (q && !(p.n + ' ' + p.inmo + ' ' + p.dir + ' ' + sect(p.sector).n).toLowerCase().includes(q)) return;
    p.u.forEach((u, k) => {
      if (S.provTip === '1D' && u.d !== 1) return;
      if (S.provTip === '2D' && u.d !== 2) return;
      rows.push({p, u, key: p.id + ':' + k, r: evaluar(p, u)});
    });
  });
  const sel = S.provSel ? projById(S.provSel) : null;
  el.innerHTML = `
  <div class="filters">
    <div class="field"><span class="lbl">Zona</span>${segHTML('provZona', [['sur', C().pref],['todas','Todas'],['norte', C().otra]], S.provZona)}</div>
    <div class="field"><span class="lbl">Tipología</span>${segHTML('provTip', [['todas','1D y 2D'],['1D','1D'],['2D','2D']], S.provTip)}</div>
    <div class="field"><span class="lbl">Estado</span>${segHTML('provEstado', [['todos','Todos'],['inmediata','Inmediata'],['verde','En verde'],['blanco','En blanco']], S.provEstado)}</div>
    <div class="field" style="flex:1;min-width:180px"><label for="provQ">Buscar</label><input id="provQ" type="text" placeholder="Proyecto, inmobiliaria o calle" value="${esc(S.provQ)}"></div>
  </div>
  <p class="small muted" style="margin:0">${rows.length} unidades en ${new Set(rows.map(r => r.p.id)).size} proyectos. Arriendo y flujo con tu perfil actual (pie ${NF0.format(S.pie*100)}%, ${S.plazo} años, ${S.banco === 'mejor' ? 'mejor tasa' : esc(BANCOS.find(b=>b.id===S.banco).n)}). Toca una fila para ver la ficha.</p>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Proyecto</th><th>Sector</th><th>Tipo</th><th class="n">m²</th><th class="n">Precio</th><th class="n">UF/m²</th><th>Estac.</th><th>Bodega</th><th>Entrega</th><th class="n">Arriendo est.</th><th class="n">GC est.</th><th class="n">Cap rate</th><th class="n">Dividendo</th><th class="n">Flujo/mes</th><th>Dato</th></tr></thead>
    <tbody>${rows.map(x => `<tr class="click${sel && sel.id === x.p.id ? ' sel' : ''}" data-p="${x.p.id}" tabindex="0">
      <td><div class="pname">${esc(x.p.n)}</div><div class="pinmo">${esc(x.p.inmo)} · ${esc(x.p.dir)}</div></td>
      <td>${esc(sect(x.p.sector).n)}${sect(x.p.sector).sur ? '' : ' <span class="pill"><i>·</i>' + esc(C().otra) + '</span>'}</td>
      <td>${esc(x.u.t)}</td>
      <td class="n">${NF1.format(x.u.m2)}${x.u.m2est ? '*' : ''}</td>
      <td class="n">${ufF(x.u.uf, 0)}${x.u.ufest || x.u.dudoso ? '*' : ''}<div class="pinmo">${clpM(x.u.uf * S.uf)}</div></td>
      <td class="n">${NF1.format(x.u.uf / x.u.m2)}</td>
      <td>${extraTxt(x.p.estac)}</td><td>${extraTxt(x.p.bodega)}</td>
      <td>${estadoPill(x.p)}<div class="pinmo">${esc(x.p.entrega)}</div></td>
      <td class="n">${clp(x.r.rent)}</td><td class="n">${clp(x.r.gcCLP)}</td>
      <td class="n">${pct(x.r.capRate)}</td><td class="n">${clp(x.r.div1 * S.uf)}</td><td class="n">${flujoCell(x.r.flujo1 * S.uf)}</td>
      <td>${confPill(x.p)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin:0">* m² o precio estimado a partir de rangos publicados. Arriendo estimado sin gastos comunes (GC): en Chile casi todos los avisos cobran los GC aparte, así que los paga el arrendatario y tú sólo los cubres en meses vacíos.</p>
  <div id="provDetail"></div>`;
  bindSegs(el, (k, v) => set(k, v));
  const qi = $('#provQ', el);
  qi.addEventListener('input', () => { S.provQ = qi.value; save(); clearTimeout(qi._t); qi._t = setTimeout(() => { const pos = qi.selectionStart; render(); const n = $('#provQ'); n.focus(); try { n.setSelectionRange(pos, pos); } catch(e) {} }, 250); });
  $$('tr.click', el).forEach(tr => {
    const open = () => { S.provSel = tr.dataset.p; save(); render(); const d = $('#provDetail'); if (d) d.scrollIntoView({behavior: 'smooth', block: 'start'}); };
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  });
  if (sel) renderDetalle($('#provDetail', el), sel);
}
function renderDetalle(el, p){
  const s = sect(p.sector);
  const evs = p.u.map((u, k) => ({u, k, r: evaluar(p, u)}));
  el.innerHTML = `<div class="panel">
    <div class="panel-head"><div><div class="label">${esc(p.inmo)}</div><h2 style="font-size:20px">${esc(p.n)}</h2><p class="sub">${esc(p.dir)} · ${esc(s.n)}</p></div>
    <div class="chips">${estadoPill(p)} ${confPill(p)} ${s.sur ? '<span class="pill acc"><i>◆</i>Zona preferida</span>' : '<span class="pill"><i>↑</i>Fuera de zona</span>'}</div></div>
    <div class="detail">
      <div>
        <div class="facts">
          <div class="kv"><div class="k">Entrega</div><div class="v" style="font-size:15px">${esc(p.entrega)}</div></div>
          <div class="kv"><div class="k">Estacionamiento</div><div class="v" style="font-size:15px">${extraTxt(p.estac)}</div></div>
          <div class="kv"><div class="k">Bodega</div><div class="v" style="font-size:15px">${extraTxt(p.bodega)}</div></div>
          <div class="kv"><div class="k">Plusvalía estimada del sector</div><div class="v" style="font-size:15px">${NF1.format(s.plus)}% real anual</div></div>
        </div>
        <h3 class="sec-title" style="margin-top:16px">Facilidades de pago y condiciones</h3>
        <ul class="clean">${p.pago.map(x => '<li>' + esc(x) + '</li>').join('')}</ul>
        ${p.extra ? '<p class="small ink2" style="margin-top:8px">' + esc(p.extra) + '</p>' : ''}
        <h3 class="sec-title" style="margin-top:14px">El sector</h3>
        <p class="small ink2">${esc(s.d)}</p>
        <h3 class="sec-title" style="margin-top:14px">Fuentes</h3>
        <ul class="clean src">${p.f.map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ul>
      </div>
      <div class="tbl-wrap" style="align-self:start"><table class="tbl"><thead><tr><th>Indicador</th>${evs.map(e => `<th class="n">${esc(e.u.t)}</th>`).join('')}</tr></thead><tbody>
        ${[['Superficie', e => NF1.format(e.u.m2) + ' m²'], ['Precio lista', e => ufF(e.u.uf, 0)], ['Precio con extras', e => ufF(e.r.P, 0)], ['Pie a pagar', e => clp(e.r.piePago * S.uf)], ['Gastos operacionales', e => clp(e.r.gastos * S.uf)],
           ['Dividendo', e => clp(e.r.div1 * S.uf)], ['Renta exigida', e => clp(e.r.sueldoReq)], ['Arriendo estimado', e => clp(e.r.rent)], ['Gastos comunes', e => clp(e.r.gcCLP)],
           ['Rentabilidad bruta', e => pct(e.r.brutaRent)], ['Cap rate', e => pct(e.r.capRate)], ['Flujo mensual', e => flujoCell(e.r.flujo1 * S.uf)], ['TIR ' + S.horizonte + ' años', e => pct(e.r.tir)], ['VAN al ' + NF0.format(S.desc*100) + '%', e => clpM(e.r.van * S.uf)]]
           .map(row => `<tr><td>${row[0]}</td>${evs.map(e => `<td class="n">${row[1](e)}</td>`).join('')}</tr>`).join('')}
        <tr><td></td>${evs.map(e => `<td class="n"><button class="btn ghost" data-sim="${p.id}:${e.k}">Simular</button></td>`).join('')}</tr>
      </tbody></table></div>
    </div></div>`;
  $$('[data-sim]', el).forEach(b => b.addEventListener('click', () => { S.sim = b.dataset.sim; S.simOv = {}; save(); go('simulador'); }));
}

function simUnit(){
  let x = S.sim ? unitByKey(S.sim) : null;
  if (x && x.p.city !== S.city) x = null;
  if (!x){ const rk = ranking(); x = rk[0] ? {p: rk[0].p, u: rk[0].u, key: rk[0].key} : unitByKey(PROYECTOS[0].id + ':0'); S.sim = x.key; }
  return x;
}

    });
    h += '</tr>';

  }).join('') + '</div>';

  const f = (1 - pie) * (i / (1 - Math.pow(1 + i, -n)) + S.desg) + 0.8 * S.inc;
  const cap = Math.max(0, Math.min(R * S.divRenta, R * S.cargaMax - S.deudas));
  return {P: cap / S.uf / f, tasa: t};
}

  if (!c.okDiv) razones.push('el dividendo (' + pct(c.divRatio) + ' de tu renta) supera el ' + pct(S.divRenta, 0));
  if (!c.okCarga) razones.push('con el consumo tu carga financiera sube a ' + pct(c.carga) + ', sobre el máximo de ' + pct(S.cargaMax, 0));
  if (!c.okHolgura) razones.push('cada mes tendrías que poner ' + clp(-c.holgura) + ' más de lo que hoy ahorras');
  let veredicto;
  if (razones.length) veredicto = '<p><span class="pill bad"><i>✕</i>No es viable</span> Porque ' + razones.join('; ') + '.</p>';
  else if (!isFinite(wAlt)) veredicto = '<p><span class="pill warn"><i>!</i>Única vía</span> Sin consumo no llegas a esta unidad con tu ahorro actual. Úsalo sólo si aceptas la holgura de ' + clp(c.holgura) + ' al mes.</p>';
  else if (interes > benef) veredicto = `<p><span class="pill warn"><i>!</i>Esperar sale más barato</span> Los intereses (${clpM(interes)}) superan lo que ganarías comprando ${mesesTxt(wAlt)} antes (${clpM(benef)}: alza de precio evitada más arriendo). Sólo conviene si la plusvalía real supera ${pct(gBE)} al año.</p>`;
  else veredicto = `<p><span class="pill good"><i>✓</i>Puede convenir</span> Comprar hoy te ahorra ${clpM(benef - interes)} frente a esperar ${mesesTxt(wAlt)}, si la plusvalía real es de al menos ${pct(gBE)} al año (el modelo estima ${pct(g)}). El costo: tu holgura mensual baja a ${clp(c.holgura)}.</p>`;
  ce.innerHTML = `<div class="panel-head"><div><h2>El crédito de consumo, en números</h2><p class="sub">Para completar el pie de una unidad y comprar antes.</p></div>
    <select id="siConsU" aria-label="Unidad a evaluar con consumo" style="max-width:280px">${consOpts.map(x => `<option value="${x.key}"${x.key === cx.key ? ' selected' : ''}>${esc(x.p.n)} · ${esc(x.u.t)}</option>`).join('')}</select></div>
    <div class="facts">
      <div class="kv"><div class="k">Monto a pedir</div><div class="v">${clpM(c.loan)}</div></div>
      <div class="kv"><div class="k">Cuota mensual</div><div class="v">${clp(c.cuotaCons)}</div></div>
      <div class="kv"><div class="k">Intereses totales</div><div class="v">${clpM(interes)}</div></div>
      <div class="kv"><div class="k">CAE aproximada</div><div class="v">${pct(cae)}</div></div>
      <div class="kv"><div class="k">Carga financiera</div><div class="v ${c.okCarga ? '' : 'neg'}">${pct(c.carga)}</div><div class="small muted">sin consumo: ${pct(cargaSin)}</div></div>
      <div class="kv"><div class="k">Holgura mensual</div><div class="v ${c.holgura >= 0 ? 'pos' : 'neg'}">${clpS(c.holgura)}</div><div class="small muted">sin consumo: ${clpS(S.ahorroMes + fl)}</div></div>
    </div>
    <div style="margin-top:14px">${veredicto}</div>
    <p class="small muted" style="margin:0">${(cx.p.meses || 0) > 0 ? 'En venta en blanco el consumo se pide al firmar y sus cuotas corren durante la obra, por eso el monto es mayor que lo que falta de pie. ' : ''}${cx.p.fogaesDuda && c.sub ? 'FOGAES exige que sea primera venta: confírmalo con el vendedor. ' : ''}Alternativa sin consumo: ${esc(caminoCorto(alt))}, firmas ${isFinite(wAlt) ? (wAlt === 0 ? 'hoy' : 'en ' + fechaEn(wAlt)) : 'sin fecha'}.</p>`;
  $('#siConsU', ce).addEventListener('change', e => set('sitSel', e.target.value));
}

/* ---------- Comparar ciudades ---------- */
function rCiudades(el){
  const ids = Object.keys(CIUDADES);
  const glob = ranking({city: 'all', zona: 'sur', tip: S.tip});
  const avg = (a, f) => a.length ? a.reduce((t, x) => t + f(x), 0) / a.length : NaN;
  const filas = ids.map(id => {
    const us = glob.filter(x => x.p.city === id);
    const secs = Object.keys(ALL_SECT).filter(k => ALL_SECT[k].city === id && ALL_SECT[k].sur).map(sect);
    return {id, c: CIUDADES[id], us, proys: new Set(us.map(x => x.p.id)).size,
      ufm2: avg(us, x => x.u.uf / x.u.m2), cap: avg(us, x => x.r.capRate), tir: avg(us, x => isFinite(x.r.tir) ? x.r.tir : 0),
      flujo: avg(us, x => x.r.flujo1 * S.uf), plus: avg(secs, s => s.plus), seg: avg(secs, s => s.seg), arr1: avg(secs, s => s.arr1),
      hoy: us.filter(x => x.plan.sinDeuda && x.plan.sinDeuda.w === 0).length, best: us[0]};
  });
  const top = glob[0];
  const segura = glob.find(x => sect(x.p.sector).seg >= 72);
  const flujo = glob.slice().sort((a, b) => b.r.flujo1 - a.r.flujo1)[0];

  const ciudadDe = x => CIUDADES[x.p.city].n;
  const pick = (tag, x, extra) => x ? `<div class="pick"><div class="tag">${esc(tag)}</div><div class="pn">${esc(x.p.n)} · ${esc(x.u.t)} <span class="muted" style="font-weight:600">· ${esc(ciudadDe(x))}</span></div><div class="small muted" style="text-align:right">#${x.rank} · ${NF0.format(x.score)} pts</div>
    <div class="small ink2" style="grid-column:1/-1">${esc(sect(x.p.sector).n)}, seguridad ${NF0.format(sect(x.p.sector).seg)}/100. ${NF1.format(x.u.m2)} m² en ${ufF(x.u.uf, 0)}. TIR ${pct(x.r.tir)}, flujo ${clpS(x.r.flujo1 * S.uf)} al mes, cap rate ${pct(x.r.capRate)}. ${extra || ''}</div></div>` : '';
  const viveOpts = ids.map(id => `<option value="${id}"${S.miCiudad === id ? ' selected' : ''}>${esc(CIUDADES[id].n)}</option>`).join('');
  el.innerHTML = `
  <div class="panel"><div class="panel-head"><div><h2>Cómo se comparan</h2><p class="sub">Sólo unidades en las zonas preferidas de cada ciudad (sur de Copiapó en Antofagasta; sectores y comunas seguras en las demás), evaluadas con tu renta, tu ahorro y tus ponderaciones del Ranking.</p></div></div>
    <div class="filters">
      <div class="field"><span class="lbl">Tipología</span>${segHTML('tip', [['todas','1D y 2D'],['1D','1D'],['2D','2D']], S.tip)}</div>
      <div class="field" style="min-width:170px"><label for="cmpVive">Vivo en</label><select id="cmpVive">${viveOpts}</select></div>
      <label class="toggle" style="align-self:center"><input id="cmpAdm" type="checkbox"${S.adminRemota ? ' checked' : ''}><span>Pagar administración (8% + IVA) donde no vivo<br><span class="muted small">Recomendado si vas a arrendar a distancia</span></span></label>
    </div></div>

  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ciudad</th><th class="n">Proyectos</th><th class="n">UF/m²</th><th class="n">Arriendo 1D ref.</th><th class="n">Cap rate</th><th class="n">TIR media</th><th class="n">Flujo medio</th><th class="n">Plusvalía</th><th class="n">Seguridad</th><th class="n">Firmas hoy</th><th style="min-width:200px">Mejor unidad</th></tr></thead>
    <tbody>${filas.map(f => `<tr class="click" data-city="${f.id}" tabindex="0"><td><b>${esc(f.c.n)}</b>${f.id === S.miCiudad ? ' <span class="pill acc"><i>◆</i>Vives aquí</span>' : ''}<div class="pinmo">${esc(f.c.pref)}</div></td>
      <td class="n">${f.proys}<div class="pinmo">${f.us.length} unid.</div></td><td class="n">${NF1.format(f.ufm2)}</td><td class="n">${clp(f.arr1)}</td><td class="n">${pct(f.cap)}</td><td class="n">${pct(f.tir)}</td><td class="n">${flujoCell(f.flujo)}</td><td class="n">${NF1.format(f.plus)}%</td><td class="n">${NF0.format(f.seg)}</td><td class="n">${f.hoy}</td>
      <td>${f.best ? `<div class="pname">${esc(f.best.p.n)} · ${esc(f.best.u.t)}</div><div class="pinmo">${NF0.format(f.best.score)} pts · TIR ${pct(f.best.r.tir)} · ${esc(estadoPlan(f.best.plan).t)}</div>` : '<span class="muted">Sin unidades con este filtro</span>'}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin:0">Toca una ciudad para abrir su resumen. Seguridad: índice 0–100 estimado por sector a partir de tasas de delitos y prensa local. "Firmas hoy" cuenta unidades que puedes comprar hoy sin crédito de consumo.</p>

  <div class="grid g-wide">
    <div class="panel memo" style="max-width:none">
      <h3>Dónde está la mejor oportunidad hoy</h3>
      <p>Con tus ponderaciones, la mejor unidad de las cuatro ciudades es <b>${top ? esc(top.p.n) + ' ' + esc(top.u.t) + ' en ' + esc(ciudadDe(top)) : '—'}</b>. ${top ? esc(porQue(top)) : ''}</p>
      ${hoy.length ? `<p>Puedes firmar hoy sin crédito de consumo en ${hoy.length === 1 ? '1 unidad' : hoy.length + ' unidades'}: ${hoy.slice(0, 6).map(x => '<b>' + esc(x.p.n) + ' ' + esc(x.u.t) + '</b> (' + esc(ciudadDe(x)) + ')').join(', ')}${hoy.length > 6 ? ' y otras' : ''}.</p>` : '<p>Con tu ahorro actual ninguna unidad de las cuatro ciudades se puede firmar hoy sin deuda de consumo.</p>'}
      <div>${pick('Mejor oportunidad global', top)}${segura && segura !== top ? pick('La mejor en un sector muy seguro', segura, 'Seguridad de 72 o más sobre 100.') : ''}${flujo && flujo !== top ? pick('Mejor flujo mensual', flujo, flujo.r.flujo1 >= 0 ? 'El arriendo cubre dividendo y costos.' : 'Aun así requiere aportar cada mes.') : ''}</div>
      <h3>Cómo leer la comparación</h3>
      <ul class="clean small">
        <li><b>Santiago</b> tiene más liquidez y demanda estable, pero cap rates más bajos y mucha oferta de departamentos pequeños.</li>
        <li><b>Antofagasta e Iquique</b> pagan más arriendo por UF invertida, a cambio de depender del ciclo minero y portuario.</li>
        <li><b>Coquimbo</b> combina la región más segura del norte con arriendo de temporada, pero con arriendos anuales más bajos.</li>
        <li>Fuera de tu ciudad, la administración a distancia ${S.adminRemota ? 'ya está descontada (8% + IVA del arriendo)' : 'no está descontada: actívala si no podrás gestionar tú el arriendo'}.</li>
      </ul>
    </div>
    <div class="panel"><h2>Mejor puntaje por ciudad</h2><p class="sub">Puntaje 0–100 de la mejor unidad, normalizado entre las cuatro ciudades.</p><div id="cmpBars"></div></div>
  </div>

  <div class="panel"><h2>Ranking nacional</h2><p class="sub">Las 15 mejores unidades de las cuatro ciudades. Es distinto del Ranking por ciudad porque aquí cada criterio se compara contra todas.</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="n">#</th><th>Unidad</th><th>Ciudad</th><th style="min-width:130px">Puntaje</th><th class="n">Precio</th><th class="n">Seguridad</th><th class="n">TIR</th><th class="n">Flujo/mes</th><th class="n">Cap rate</th><th>Cuándo</th></tr></thead>
    <tbody>${glob.slice(0, 15).map(x => `<tr class="click" data-k="${x.key}" data-c="${x.p.city}" tabindex="0"><td class="n"><b>${x.rank}</b></td><td><div class="pname">${esc(x.p.n)} · ${esc(x.u.t)}</div><div class="pinmo">${esc(x.p.inmo)} · ${esc(sect(x.p.sector).n)}</div></td><td>${esc(ciudadDe(x))}</td>
      <td><div class="bar-track" style="height:14px"><div class="bar-fill ${x.rank === 1 ? 'em' : ''}" style="width:${x.score.toFixed(1)}%"></div></div><div class="pinmo mono">${NF0.format(x.score)} / 100</div></td>
      <td class="n">${ufF(x.u.uf, 0)}</td><td class="n">${NF0.format(sect(x.p.sector).seg)}</td><td class="n">${pct(x.r.tir)}</td><td class="n">${flujoCell(x.r.flujo1 * S.uf)}</td><td class="n">${pct(x.r.capRate)}</td><td>${planPill(x.plan)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">Toca una fila para simularla en su ciudad.</p></div>`;
  bindSegs(el, (k, v) => set(k, v));

  $$('tr[data-city]', el).forEach(tr => { const f = () => cambiarCiudad(tr.dataset.city, 'resumen'); tr.addEventListener('click', f); tr.addEventListener('keydown', e => { if (e.key === 'Enter') f(); }); });
  $$('tr[data-k]', el).forEach(tr => { const f = () => { setCity(tr.dataset.c); S.provSel = null; S.escSel = []; S.escFocus = null; S.sitSel = null; S.sim = tr.dataset.k; S.simOv = {}; save(); go('simulador'); }; tr.addEventListener('click', f); tr.addEventListener('keydown', e => { if (e.key === 'Enter') f(); }); });
  const rows = filas.filter(f => f.best).sort((a, b) => b.best.score - a.best.score).map((f, i) => ({l: f.c.n, s: f.best.p.n + ' ' + f.best.u.t, v: f.best.score, em: i === 0,
    tip: `<div class="tv">${NF0.format(f.best.score)} puntos</div><div class="tl">${esc(f.best.p.n)} ${esc(f.best.u.t)} · ${esc(f.c.n)}</div><div class="tl">TIR ${pct(f.best.r.tir)} · seguridad ${NF0.format(sect(f.best.p.sector).seg)}</div>`}));

  bindBarTips($('#cmpBars', el));
