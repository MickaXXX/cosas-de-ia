<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <meta name="description" content="Mapa y análisis de proyectos de departamentos para inversión en Santiago: entrega, arriendo en 2 km, dividendo, flujo, riesgo y ranking explicable.">
  <title>Atlas Inversión Santiago</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Tema antes de pintar, para no parpadear.
    try { const t = localStorage.getItem('atlas.theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 4 12v16h9v-8h6v8h9V12z" fill="currentColor"/></svg>
      <div>
        <div class="brand-name">Atlas Inversión Santiago</div>
        <div class="brand-sub" id="ufChip">Cargando UF…</div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <button data-view="mapa" class="active">Mapa</button>
      <button data-view="ranking">Ranking</button>
      <button data-view="comparador">Comparador <span class="count" id="cmpCount"></span></button>
      <button data-view="simulador">Simulador</button>
      <button data-view="radar">Radar urbano</button>
      <button data-view="alertas">Alertas <span class="count" id="alertCount"></span></button>
      <button data-view="favoritos">Mis favoritos</button>
      <button data-view="asesor">Asesor IA</button>
      <button data-view="fuentes">Fuentes y datos</button>
      <button data-view="config">Configuración</button>
    </nav>
    <div class="top-actions">
      <label class="switch" title="Mostrar datos ficticios de demostración (nunca entran al ranking real)">
        <input type="checkbox" id="demoToggle"><span>Modo DEMO</span>
      </label>
      <button class="icon-btn" id="themeBtn" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">◐</button>
    </div>
  </header>

  <div id="demoBanner" class="demo-banner" hidden>DEMO / DATOS SIMULADOS — los proyectos y avisos marcados DEMO son ficticios y no entran al ranking real.</div>

  <main id="main">
    <section id="view-mapa" class="view view-map active" aria-label="Mapa explorador">
      <aside class="filters" id="filters" aria-label="Filtros"></aside>
      <div class="map-wrap">
        <div id="map" role="application" aria-label="Mapa de Santiago"></div>
        <div class="map-search">
          <input id="searchBox" type="search" placeholder="Buscar proyecto, dirección, comuna o estación…" autocomplete="off" aria-label="Buscar">
          <div id="searchResults" class="search-results" hidden></div>
        </div>
        <button class="map-btn filters-toggle" id="filtersToggle" title="Filtros">☰ Filtros</button>
        <button class="map-btn opps-toggle" data-action="opps-toggle" title="Oportunidades en el mapa">★ Oportunidades</button>
        <div class="map-layers" id="layersPanel"></div>
        <div class="legend" id="legend"></div>
        <div class="map-note" id="mapNote" hidden></div>
        <div class="draw-hint" id="drawHint" hidden>Haz clic para agregar vértices · doble clic para cerrar la zona · Esc para cancelar</div>
      </div>
      <aside class="opps" id="opps" aria-label="Oportunidades en el mapa"></aside>
    </section>
    <section id="view-ranking" class="view" aria-label="Ranking"></section>
    <section id="view-comparador" class="view" aria-label="Comparador"></section>
    <section id="view-simulador" class="view" aria-label="Simulador"></section>
    <section id="view-radar" class="view" aria-label="Radar urbano"></section>
    <section id="view-alertas" class="view" aria-label="Alertas"></section>
    <section id="view-favoritos" class="view" aria-label="Mis favoritos"></section>
    <section id="view-asesor" class="view" aria-label="Asesor IA"></section>
    <section id="view-fuentes" class="view" aria-label="Fuentes y datos"></section>
    <section id="view-config" class="view" aria-label="Configuración"></section>
  </main>

  <div class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Ficha del proyecto">
    <div class="drawer-inner" id="drawerInner"></div>
  </div>
  <div class="modal-back" id="modalBack" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
