# Perfiles:
#   (ninguno)      → básico: base de datos, cola, API y web. Visor e importación GLB; sin reconstrucción.
#   --profile cpu  → agrega el trabajador de reconstrucción en CPU (probado).
#   --profile gpu  → trabajador con OpenMVS compilado con CUDA (NO probado en el entorno de desarrollo).
# Solo escucha en 127.0.0.1. Para un despliegue compartido: TLS delante, secretos fuera del código y backups.
name: planta3d
x-env: &env
  P3D_DATABASE_URL: postgresql+psycopg://planta3d:${P3D_DB_PASSWORD:?define P3D_DB_PASSWORD en .env}@db:5432/planta3d
  P3D_REDIS_URL: redis://redis:6379/0
  P3D_SECRET_KEY: ${P3D_SECRET_KEY:?define P3D_SECRET_KEY en .env}
  P3D_ENVIRONMENT: ${P3D_ENVIRONMENT:-production}
  P3D_APP_NAME: ${P3D_APP_NAME:-Planta 3D}
  P3D_BOOTSTRAP_ADMIN_EMAIL: ${P3D_BOOTSTRAP_ADMIN_EMAIL:-admin@planta3d.local}
  P3D_BOOTSTRAP_ADMIN_PASSWORD: ${P3D_BOOTSTRAP_ADMIN_PASSWORD:?define P3D_BOOTSTRAP_ADMIN_PASSWORD en .env}
  P3D_CORS_ORIGINS: '["http://127.0.0.1:8000"]'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planta3d
      POSTGRES_PASSWORD: ${P3D_DB_PASSWORD}
      POSTGRES_DB: planta3d
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planta3d"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    # Valkey (BSD-3), compatible con el protocolo de Redis. Las versiones recientes de Redis usan RSAL/SSPL.
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: planta3d-api
    environment: *env
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }

  api:
    image: planta3d-api
    environment: *env
    volumes: [files:/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    profiles: [cpu]
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    image: planta3d-worker
    environment: *env
    volumes: [files:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    stop_grace_period: 30s
    restart: unless-stopped

  worker-gpu:
    profiles: [gpu]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args: { BASE_IMAGE: "nvidia/cuda:12.6.3-devel-ubuntu24.04", OPENMVS_CUDA: "ON" }
    image: planta3d-worker-gpu
    environment: *env
    volumes: [files:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  files:
