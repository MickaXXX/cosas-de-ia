[project]
name = "planta3d-backend"
version = "0.1.0"
description = "Planta 3D: reconstrucción fotogramétrica y documentación de sectores industriales"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "numpy>=2.0",
  "pycolmap==4.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
